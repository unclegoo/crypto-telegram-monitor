                                  f"{change_60:+.2f}%\n\n"

                                  f"📊 Volume: "
                                  f"{volume_ratio:.1f}x\n\n"

                                  "Объём значительно выше "
                                  "обычного.\n\n"

                                  "Bitget Spot"
                              )


                              print(
                                  "\nVOLUME ALERT:\n"
                                  + message
                              )


                              try:

                                  success = send_telegram(
                                      message
                                  )


                                  if success:

                                      mark_alert_sent(
                                          state,
                                          fingerprint
                                      )

                                      alerts_sent += 1


                              except Exception as e:

                                  print(
                                      f"Telegram volume error: "
                                      f"{e}"
                                  )


              except Exception as e:

                  print(
                      f"ERROR {symbol}: {e}"
                  )


          # ============================================================
          # STANDALONE FUNDAMENTAL NEWS
          # ============================================================

          try:

              news_sent = (
                  send_standalone_news(
                      state,
                      news_context,
                      combined_news
                  )
              )


          except Exception as e:

              print(
                  f"NEWS PROCESS ERROR: {e}"
              )

              news_sent = 0


          # ============================================================
          # SAVE
          # ============================================================

          save_state(
              state
          )


          try:

              save_state_to_github()

          except Exception as e:

              print(
                  f"GitHub state save error: "
                  f"{e}"
              )


          # ============================================================
          # SUMMARY
          # ============================================================

          print("")
          print("=" * 75)


          print(
              f"Price/combined alerts sent: "
              f"{alerts_sent}"
          )


          print(
              f"Standalone news alerts sent: "
              f"{news_sent}"
          )


          if (
              alerts_sent == 0
              and
              news_sent == 0
          ):

              print(
                  "No alerts."
              )


          print("=" * 75)

          PY
