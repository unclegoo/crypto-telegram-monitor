                  calculate_signal_strength(
                      price_alerts,
                      news_article
                  )
              )

              fingerprint = (
                  f'{symbol}:'
                  f'{signal_type}:'
                  f'{level}:'
                  f'{period}:'
                  f'{direction}'
              )

              if alert_already_sent(
                  state,
                  fingerprint
              ):
                  return False

              def fmt_change(value):
                  if value is None:
                      return 'н/д'
                  return f'{value:+.2f}%'

              message = (
                  f'{direction} '
                  f'{symbol}\n\n'
                  f'💰 Цена: '
                  f'{price:.10g}\n\n'
                  f'5m: '
                  f'{fmt_change(market["change_5"])}\n'
                  f'15m: '
                  f'{fmt_change(market["change_15"])}\n'
                  f'30m: '
                  f'{fmt_change(market["change_30"])}\n'
                  f'45m: '
                  f'{fmt_change(market["change_45"])}\n'
                  f'60m: '
                  f'{fmt_change(market["change_60"])}\n\n'
                  f'🟠 {level} MOVE\n'
                  f'🔥 Сила сигнала: '
                  f'{signal_strength}\n'
                  f'⏱ Период: {period}'
              )

              if news_article:

                  message += (
                      '\n\n'
                      '📰 Фундаментальный фактор:\n'
                      +
                      format_news_line(
                          news_article
                      )
                  )

              link = (
                  news_article.get(
                      'link'
                  )
                  if news_article
                  else None
              )

              if link:
                  message += (
                      '\n'
                      + link
                  )

              message += (
                  '\n\nBitget Spot'
              )

              print(
                  '\nPRICE ALERT:\n'
                  + message
              )

              try:
                  success = send_telegram(
                      message
                  )

                  if success:

                      mark_alert_sent(
                          state,
                          fingerprint
                      )

                      if news_article:
                          fp = news_fingerprint(
                              news_article,
                              symbol
                          )

                          mark_news_sent(
                              state,
                              fp
                          )

                      return True

              except Exception as e:
                  print(
                      f'Telegram price error: '
                      f'{e}'
                  )

              return False


