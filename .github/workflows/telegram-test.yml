name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import hashlib
          import re
          import subprocess
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime


          # ============================================================
          # CONFIG
          # ============================================================

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TEST_TELEGRAM = os.environ.get("TEST_TELEGRAM", "").lower() == "true"

          STATE_FILE = ".crypto_monitor_state.json"

          # Market
          BITGET_URL = "https://api.bitget.com/api/v3/market/candles"

          # News
        
  NEWS_FEEDS = [
    ("РБК", "https://rssexport.rbc.ru/rbcnews/news/30/full.rss"),
    ("Investing.com", "https://ru.investing.com/rss/news_301.rss"),
    ("ForkLog", "https://forklog.com/feed"),
    ("Bits.media", "https://bits.media/feed"),
]
    

          NEWS_LOOKBACK_HOURS = 2
          MAX_NEWS_ALERTS_PER_RUN = 3
          NEWS_TIMEOUT = 20

          # Alert cooldown
          ALERT_COOLDOWN_MINUTES = 60

          # Price thresholds
          EXTREME_60 = 12.0
          STRONG_30 = 8.0
          SHARP_60 = 5.0
          ABNORMAL_VOLUME_RATIO = 3.0
          ABNORMAL_VOLUME_MOVE = 3.0


          # ============================================================
          # COINS
          # ============================================================

          SYMBOLS = [
              "BTCUSDT",
              "ETHUSDT",
              "XRPUSDT",
              "ETCUSDT",
              "FILUSDT",
              "ETHFIUSDT",
              "ONDOUSDT",
              "TWTUSDT",
              "XLMUSDT",
              "ARKMUSDT",
              "GRAMUSDT",
              "STRKUSDT",
              "ARBUSDT",
              "STXUSDT",
              "RENDERUSDT",
              "JUPUSDT",
              "PYTHUSDT",
              "FETUSDT",
              "PEPEUSDT",
              "MANTAUSDT",
              "ZKUSDT",
              "HYPEUSDT",
          ]


          # ============================================================
          # NEWS KEYWORDS
          # ============================================================

          NEWS_KEYWORDS = {
              "BTC": [
                  "bitcoin",
                  "btc"
              ],

              "ETH": [
                  "ethereum",
                  "ether",
                  "eth"
              ],

              "XRP": [
                  "xrp",
                  "ripple"
              ],

              "ETC": [
                  "ethereum classic"
              ],

              "FIL": [
                  "filecoin"
              ],

              "ETHFI": [
                  "ether.fi",
                  "etherfi",
                  "ethfi"
              ],

              "ONDO": [
                  "ondo finance",
                  "ondo"
              ],

              "TWT": [
                  "trust wallet",
                  "trustwallet",
                  "twt"
              ],

              "XLM": [
                  "stellar",
                  "xlm"
              ],

              "ARKM": [
                  "arkham",
                  "arkm"
              ],

              "GRAM": [
                  "gram token",
                  "gram cryptocurrency",
                  "gram crypto"
              ],

              "STRK": [
                  "starknet",
                  "strk"
              ],

              "ARB": [
                  "arbitrum"
              ],

              "STX": [
                  "stacks"
              ],

              "RENDER": [
                  "render network",
                  "render token"
              ],

              "JUP": [
                  "jupiter exchange",
                  "jupiter crypto",
                  "jupiter"
              ],

              "PYTH": [
                  "pyth network",
                  "pyth"
              ],

              "FET": [
                  "fetch.ai",
                  "fetch ai",
                  "artificial superintelligence alliance"
              ],

              "PEPE": [
                  "pepe coin",
                  "pepe token",
                  "pepe crypto"
              ],

              "MANTA": [
                  "manta network",
                  "manta"
              ],

              "ZK": [
                  "zksync",
                  "zk sync"
              ],

              "HYPE": [
                  "hyperliquid"
              ],
          }


          # ============================================================
          # IMPORTANT NEWS SIGNALS
          # ============================================================

          NEWS_SIGNALS = [
              (
                  "🚨 SECURITY",
                  [
                      "hack",
                      "hacked",
                      "exploit",
                      "exploited",
                      "vulnerability",
                      "breach",
                      "stolen",
                      "stole",
                      "attack",
                      "attacked",
                      "drained",
                      "compromised",
                      "security flaw",
                      "funds stolen",
                      "network halted",
                  ],
              ),

              (
                  "🔴 LISTING / DELISTING",
                  [
                      "listing",
                      "listed",
                      "delisting",
                      "delisted",
                      "trading support",
                      "adds support",
                      "removed from",
                  ],
              ),

              (
                  "⚖️ REGULATION",
                  [
                      "sec",
                      "cftc",
                      "regulator",
                      "regulation",
                      "regulatory",
                      "lawsuit",
                      "court",
                      "legal",
                      "ban",
                      "banned",
                      "approval",
                      "etf",
                  ],
              ),

              (
                  "🔓 TOKEN UNLOCK",
                  [
                      "token unlock",
                      "unlock",
                      "unlocks",
                      "vesting",
                      "tokens released",
                  ],
              ),

              (
                  "🏦 INSTITUTIONAL",
                  [
                      "institutional",
                      "institution",
                      "asset manager",
                      "etf",
                      "treasury",
                      "fund",
                  ],
              ),

              (
                  "💰 FUNDING / INVESTMENT",
                  [
                      "funding",
                      "investment",
                      "investor",
                      "raises",
                      "raised",
                      "financing",
                      "capital",
                  ],
              ),

              (
                  "🤝 PARTNERSHIP",
                  [
                      "partnership",
                      "partner",
                      "partners",
                      "integration",
                      "collaboration",
                  ],
              ),

              (
                  "🚀 NETWORK UPDATE",
                  [
                      "upgrade",
                      "hard fork",
                      "mainnet",
                      "testnet",
                      "launch",
                      "released",
                      "release",
                  ],
              ),
          ]


          # ============================================================
          # HTTP
          # ============================================================

          def http_get_json(url, params=None, timeout=20):
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Uncle-Goo-Crypto-Monitor/1.0"
                  }
              )

              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))


          def http_get_text(url, timeout=20):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Uncle-Goo-Crypto-Monitor/1.0",
                      "Accept": "application/rss+xml, application/xml, text/xml, */*",
                  }
              )

              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_api(method, payload=None):
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/{method}"

              data = None

              if payload is not None:
                  data = urllib.parse.urlencode(payload).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "User-Agent": "Uncle-Goo-Crypto-Monitor/1.0"
                  }
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))


          def get_chat_id():
              result = telegram_api("getUpdates")

              updates = result.get("result", [])

              if not updates:
                  return None

              for update in reversed(updates):
                  message = update.get("message")

                  if message and message.get("chat"):
                      return message["chat"]["id"]

              return None


          def send_telegram(text):
              chat_id = get_chat_id()

              if chat_id is None:
                  print("Telegram chat ID not found.")
                  print("Send /start to the bot first.")
                  return False

              result = telegram_api(
                  "sendMessage",
                  {
                      "chat_id": chat_id,
                      "text": text,
                      "disable_web_page_preview": False,
                  }
              )

              return result.get("ok", False)


          # ============================================================
          # STATE
          # ============================================================

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      "alerts": {},
                      "news": {}
                  }

              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      raw = json.load(f)

                  # Migration from previous version
                  if "alerts" not in raw and "news" not in raw:
                      return {
                          "alerts": raw,
                          "news": {}
                      }

                  raw.setdefault("alerts", {})
                  raw.setdefault("news", {})

                  return raw

              except Exception:
                  return {
                      "alerts": {},
                      "news": {}
                  }


          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def save_state_to_github():
              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE
                  ],
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                   ]           
                  )

              if result.returncode == 0:
                  return

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update crypto monitor state"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "push"
                  ],
                  check=True
              )


          # ============================================================
          # PRICE ALERT DEDUP
          # ============================================================

          def should_send_alert(state, fingerprint):
              item = state["alerts"].get(fingerprint)

              if not item:
                  return True

              try:
                  sent_at = datetime.fromisoformat(
                      item["sent_at"]
                  )

                  now = datetime.now(timezone.utc)

                  age = (
                      now - sent_at
                  ).total_seconds() / 60

                  return age >= ALERT_COOLDOWN_MINUTES

              except Exception:
                  return True


          def mark_alert_sent(state, fingerprint):
              state["alerts"][fingerprint] = {
                  "sent_at": datetime.now(timezone.utc).isoformat()
              }


          # ============================================================
          # BITGET MARKET DATA
          # ============================================================

          def get_candles(symbol):
              data = http_get_json(
                  BITGET_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                      "interval": "5m",
                      "limit": 30,
                  }
              )

              if data.get("code") != "00000":
                  raise RuntimeError(
                      f"Bitget error: {data}"
                  )

              candles = data.get("data", [])

              if len(candles) < 13:
                  raise RuntimeError(
                      f"Not enough candles for {symbol}"
                  )

              # Bitget normally returns newest first.
              candles = list(reversed(candles))

              closes = [
                  float(c[4])
                  for c in candles
              ]

              volumes = [
                  float(c[5])
                  for c in candles
              ]

              return closes, volumes


          def calculate_market(symbol):
              closes, volumes = get_candles(symbol)

              price_now = closes[-1]

              price_30 = closes[-7]
              price_60 = closes[-13]

              change_30 = (
                  (price_now / price_30) - 1
              ) * 100

              change_60 = (
                  (price_now / price_60) - 1
              ) * 100

              current_volume = sum(volumes[-6:])
              previous_volume = sum(volumes[-12:-6])

              if previous_volume > 0:
                  volume_ratio = (
                      current_volume / previous_volume
                  )
              else:
                  volume_ratio = 0

              return {
                  "price": price_now,
                  "change_30": change_30,
                  "change_60": change_60,
                  "volume_ratio": volume_ratio,
              }


          # ============================================================
          # NEWS
          # ============================================================

          def clean_text(text):
              if not text:
                  return ""

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def parse_date(value):
              if not value:
                  return None

              value = value.strip()

              try:
                  dt = parsedate_to_datetime(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(timezone.utc)

              except Exception:
                  pass

              try:
                  value2 = value.replace(
                      "Z",
                      "+00:00"
                  )

                  dt = datetime.fromisoformat(
                      value2
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None


          def parse_feed(source, url):
              try:
                  raw = http_get_text(
                      url,
                      NEWS_TIMEOUT
                  )

                  root = ET.fromstring(raw)

              except Exception as e:
                  print(
                      f"News feed error [{source}]: {e}"
                  )
                  return []

              articles = []

              # RSS
              for item in root.findall(".//item"):
                  title = clean_text(
                      item.findtext("title")
                  )

                  link = clean_text(
                      item.findtext("link")
                  )

                  guid = clean_text(
                      item.findtext("guid")
                  )

                  description = clean_text(
                      item.findtext("description")
                  )

                  pub_date = clean_text(
                      item.findtext("pubDate")
                  )

                  published = parse_date(
                      pub_date
                  )

                  if not link:
                      link = guid

                  if title:
                      articles.append(
                          {
                              "source": source,
                              "title": title,
                              "link": link,
                              "summary": description,
                              "published": published,
                          }
                      )

              # Atom
              if not articles:
                  namespaces = {
                      "atom": "http://www.w3.org/2005/Atom"
                  }

                  for entry in root.findall(
                      ".//atom:entry",
                      namespaces
                  ):
                      title_node = entry.find(
                          "atom:title",
                          namespaces
                      )

                      title = clean_text(
                          title_node.text
                          if title_node is not None
                          else ""
                      )

                      link = ""

                      for link_node in entry.findall(
                          "atom:link",
                          namespaces
                      ):
                          href = link_node.attrib.get(
                              "href",
                              ""
                          )

                          rel = link_node.attrib.get(
                              "rel",
                              "alternate"
                          )

                          if href and rel == "alternate":
                              link = href
                              break

                      summary_node = entry.find(
                          "atom:summary",
                          namespaces
                      )

                      summary = clean_text(
                          summary_node.text
                          if summary_node is not None
                          else ""
                      )

                      published_node = entry.find(
                          "atom:published",
                          namespaces
                      )

                      updated_node = entry.find(
                          "atom:updated",
                          namespaces
                      )

                      date_text = ""

                      if published_node is not None:
                          date_text = published_node.text or ""

                      if not date_text and updated_node is not None:
                          date_text = updated_node.text or ""

                      published = parse_date(
                          date_text
                      )

                      if title:
                          articles.append(
                              {
                                  "source": source,
                                  "title": title,
                                  "link": link,
                                  "summary": summary,
                                  "published": published,
                              }
                          )

              return articles


          def article_coin_matches(article):
              text = (
                  article["title"]
                  + " "
                  + article["summary"]
              ).lower()

              title = article["title"].lower()

              matches = []

              for coin, keywords in NEWS_KEYWORDS.items():

                  # Stronger matching in title
                  title_match = any(
                      keyword.lower() in title
                      for keyword in keywords
                  )

                  if title_match:
                      matches.append(coin)
                      continue

                  # Summary match is accepted only
                  # for strong news signals.
                  summary_match = any(
                      keyword.lower() in text
                      for keyword in keywords
                  )

                  if summary_match:
                      signal = detect_news_signal(
                          text
                      )

                      if signal is not None:
                          matches.append(coin)

              return matches


          def detect_news_signal(text):
              for label, keywords in NEWS_SIGNALS:
                  for keyword in keywords:
                      if keyword in text:
                          return label

              return "📰 NEWS"


          def news_fingerprint(article):
              base = (
                  article["title"]
                  .strip()
                  .lower()
              )

              return hashlib.sha256(
                  base.encode("utf-8")
              ).hexdigest()


          def format_news(article, coins, signal):
              coins_text = ", ".join(
                  f"${coin}"
                  for coin in coins
              )

              published = article.get(
                  "published"
              )

              if published:
                  time_text = published.strftime(
                      "%H:%M UTC"
                  )
              else:
                  time_text = "time unknown"

              link = article.get(
                  "link",
                  ""
              )

              message = (
                  f"{signal}\n\n"
                  f"🪙 {coins_text}\n"
                  f"📰 {article['title']}\n\n"
                  f"Источник: {article['source']}\n"
                  f"Время: {time_text}"
              )

              if link:
                  message += (
                      f"\n\n🔗 {link}"
                  )

              return message


          def process_news(state):
              now = datetime.now(
                  timezone.utc
              )

              cutoff = (
                  now
                  - timedelta(
                      hours=NEWS_LOOKBACK_HOURS
                  )
              )

              candidates = []

              for source, url in NEWS_FEEDS:
                  articles = parse_feed(
                      source,
                      url
                  )

                  print(
                      f"{source}: "
                      f"{len(articles)} articles"
                  )

                  for article in articles:

                      published = article.get(
                          "published"
                      )

                      if published:
                          if published < cutoff:
                              continue

                      coins = article_coin_matches(
                          article
                      )

                      if not coins:
                          continue

                      fingerprint = news_fingerprint(
                          article
                      )

                      if fingerprint in state["news"]:
                          continue

                      signal = detect_news_signal(
                          (
                              article["title"]
                              + " "
                              + article["summary"]
                          ).lower()
                      )

                      candidates.append(
                          (
                              article,
                              coins,
                              signal,
                              fingerprint
                          )
                      )

              # Newest first
              candidates.sort(
                  key=lambda x: (
                      x[0]["published"]
                      or datetime.min.replace(
                          tzinfo=timezone.utc
                      )
                  ),
                  reverse=True
              )

              sent_count = 0

              for article, coins, signal, fingerprint in candidates:

                  if sent_count >= MAX_NEWS_ALERTS_PER_RUN:
                      break

                  message = format_news(
                      article,
                      coins,
                      signal
                  )

                  print(
                      "\nNEWS ALERT:\n"
                      + message
                  )

                  try:
                      success = send_telegram(
                          message
                      )

                      if success:
                          state["news"][fingerprint] = {
                              "sent_at": now.isoformat(),
                              "title": article["title"],
                          }

                          sent_count += 1

                  except Exception as e:
                      print(
                          f"Telegram news error: {e}"
                      )

              # Remove very old news fingerprints
              retention_cutoff = (
                  now
                  - timedelta(days=7)
              )

              for fingerprint in list(
                  state["news"].keys()
              ):
                  try:
                      sent_at = datetime.fromisoformat(
                          state["news"][fingerprint]["sent_at"]
                      )

                      if sent_at < retention_cutoff:
                          del state["news"][fingerprint]

                  except Exception:
                      pass

              return sent_count


          # ============================================================
          # TEST TELEGRAM
          # ============================================================

          if TEST_TELEGRAM:
              message = (
                  "🚀 UNCLE GOO CRYPTO MONITOR\n\n"
                  "Telegram works!\n\n"
                  "✅ Price monitor\n"
                  "✅ Volume monitor\n"
                  "✅ Alert deduplication\n"
                  "✅ News monitor\n"
                  "✅ CoinDesk\n"
                  "✅ Cointelegraph\n\n"
                  "⏱ Monitor interval: 5 minutes"
              )

              success = send_telegram(
                  message
              )

              print(
                  "Telegram test:",
                  success
              )

              raise SystemExit(0)


          # ============================================================
          # MAIN
          # ============================================================

          state = load_state()

          alerts_sent = 0

          print(
              "=============================="
          )
          print(
              "UNCLE GOO CRYPTO MONITOR"
          )
          print(
              "=============================="
          )

          # ------------------------------------------------------------
          # MARKET MONITOR
          # ------------------------------------------------------------

          for symbol in SYMBOLS:

              try:
                  market = calculate_market(
                      symbol
                  )

                  change_30 = market[
                      "change_30"
                  ]

                  change_60 = market[
                      "change_60"
                  ]

                  volume_ratio = market[
                      "volume_ratio"
                  ]

                  print(
                      f"{symbol}: "
                      f"30m={change_30:+.2f}% "
                      f"60m={change_60:+.2f}% "
                      f"volume={volume_ratio:.1f}x"
                  )

                  alerts = []

                  if abs(change_60) >= EXTREME_60:
                      alerts.append(
                          (
                              "EXTREME",
                              change_60,
                              "60m"
                          )
                      )

                  elif abs(change_30) >= STRONG_30:
                      alerts.append(
                          (
                              "STRONG",
                              change_30,
                              "30m"
                          )
                      )

                  elif abs(change_60) >= SHARP_60:
                      alerts.append(
                          (
                              "SHARP",
                              change_60,
                              "60m"
                          )
                      )

                  if (
                      volume_ratio >=
                      ABNORMAL_VOLUME_RATIO
                      and
                      abs(change_60) >=
                      ABNORMAL_VOLUME_MOVE
                  ):
                      alerts.append(
                          (
                              "VOLUME",
                              change_60,
                              "60m"
                          )
                      )

                  for level, change, period in alerts:

                      direction = (
                          "UP"
                          if change > 0
                          else "DOWN"
                      )

                      fingerprint = (
                          f"{symbol}:"
                          f"{level}:"
                          f"{direction}"
                      )

                      if not should_send_alert(
                          state,
                          fingerprint
                      ):
                          continue

                      if level == "EXTREME":
                          emoji = "🚨"
                          title = "EXTREME MOVE"

                      elif level == "STRONG":
                          emoji = "🔴"
                          title = "STRONG MOVE"

                      elif level == "SHARP":
                          emoji = "🟠"
                          title = "SHARP MOVE"

                      else:
                          emoji = "🟣"
                          title = "ABNORMAL VOLUME"

                      message = (
                          f"{emoji} {title}\n\n"
                          f"🪙 {symbol}\n"
                          f"💰 Price: "
                          f"{market['price']:.10g}\n"
                          f"📈 {period}: "
                          f"{change:+.2f}%\n"
                          f"📊 Volume: "
                          f"{volume_ratio:.1f}x\n\n"
                          f"Bitget Spot"
                      )

                      print(
                          "\nPRICE ALERT:\n"
                          + message
                      )

                      try:
                          success = send_telegram(
                              message
                          )

                          if success:
                              mark_alert_sent(
                                  state,
                                  fingerprint
                              )

                              alerts_sent += 1

                      except Exception as e:
                          print(
                              f"Telegram price error: {e}"
                          )

              except Exception as e:
                  print(
                      f"ERROR {symbol}: {e}"
                  )


          # ------------------------------------------------------------
          # NEWS MONITOR
          # ------------------------------------------------------------

          news_sent = process_news(
              state
          )


          # ------------------------------------------------------------
          # SAVE STATE
          # ------------------------------------------------------------

          if alerts_sent > 0 or news_sent > 0:
              save_state(state)

              try:
                  save_state_to_github()
              except Exception as e:
                  print(
                      f"State git save error: {e}"
                  )

          print(
              "\n=============================="
          )

          print(
              f"Price alerts sent: {alerts_sent}"
          )

          print(
              f"News alerts sent: {news_sent}"
          )

          if alerts_sent == 0 and news_sent == 0:
              print(
                  "No alerts."
              )

          print(
              "=============================="
          )

          PY
