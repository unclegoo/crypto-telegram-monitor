              )

              result = subprocess.run(
                  [
                      'git',
                      'diff',
                      '--cached',
                      '--quiet'
                  ],
                  check=False
              )

              if result.returncode == 0:
                  print(
                      'No state changes to commit.'
                  )
                  return

              subprocess.run(
                  [
                      'git',
                      'commit',
                      '-m',
                      'Update crypto monitor state'
                  ],
                  check=False
              )

              subprocess.run(
                  [
                      'git',
                      'push'
                  ],
                  check=False
