name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]

          COINS = [
              "BTC", "ETH", "XRP", "ETC", "FIL", "ETHFI",
              "ONDO", "TWT", "XLM", "ARKM", "GRAM", "STRK",
              "ARB", "STX", "RENDER", "JUP", "PYTH", "FET",
              "PEPE", "MANTA", "ZK", "HYPE"
          ]

          BASE = "https://api.bitget.com"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Uncle-Goo-Crypto-Monitor/1.0"
                  }
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode())

          def get_chat_id():
              url = (
                  f"https://api.telegram.org/bot{TOKEN}/getUpdates"
              )

              result = get_json(url)

              if not result.get("ok"):
                  raise RuntimeError("Telegram getUpdates error")

              updates = result.get("result", [])

              if not updates:
                  raise RuntimeError(
                      "Telegram chat ID not found. Send /start to the bot."
                  )

              for update in reversed(updates):
                  message = update.get("message")

                  if message and message.get("chat"):
                      return message["chat"]["id"]

              raise RuntimeError(
                  "No Telegram private chat found."
              )

          def send_message(chat_id, text):
              url = (
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              )

              body = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": text
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=body,
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram error: {result}"
                  )

          def get_candles(symbol):
              params = urllib.parse.urlencode({
                  "category": "SPOT",
                  "symbol": symbol,
                  "interval": "5m",
                  "limit": "13"
              })

              url = (
                  BASE +
                  "/api/v3/market/candles?" +
                  params
              )

              result = get_json(url)

              if result.get("code") != "00000":
                  return []

              return result.get("data", [])

          def get_available_symbols():
              url = (
                  BASE +
                  "/api/v2/spot/public/symbols"
              )

              result = get_json(url)

              if result.get("code") != "00000":
                  raise RuntimeError(
                      "Cannot get Bitget symbols"
                  )

              symbols = set()

              for item in result.get("data", []):
                  symbol = item.get("symbol")

                  if symbol:
                      symbols.add(symbol.upper())

              return symbols

          # --------------------------------------------------
          # Telegram
          # --------------------------------------------------

          chat_id = get_chat_id()

          # --------------------------------------------------
          # Bitget
          # --------------------------------------------------

          available_symbols = get_available_symbols()

          alerts = []
          unavailable = []

          for coin in COINS:

              symbol = coin + "USDT"

              if symbol not in available_symbols:
                  unavailable.append(coin)
                  continue

              try:

                  data = get_candles(symbol)

                  if len(data) < 13:
                      print(
                          f"{symbol}: insufficient candle data"
                      )
                      continue

                  # Bitget returns newest candle first.
                  data = list(reversed(data))

                  price_60m = float(data[0][4])
                  price_30m = float(data[6][4])
                  current_price = float(data[-1][4])

                  change_60m = (
                      current_price / price_60m - 1
                  ) * 100

                  change_30m = (
                      current_price / price_30m - 1
                  ) * 100

                  volumes = [
                      float(candle[5])
                      for candle in data[:-1]
                  ]

                  current_volume = float(data[-1][5])

                  average_volume = (
                      sum(volumes) / len(volumes)
                  )

                  if average_volume > 0:
                      volume_ratio = (
                          current_volume /
                          average_volume
                      )
                  else:
                      volume_ratio = 0

                  level = None

                  if abs(change_60m) >= 12:
                      level = (
                          "🚨 ЭКСТРЕМАЛЬНОЕ ДВИЖЕНИЕ"
                      )

                  elif abs(change_30m) >= 8:
                      level = (
                          "🔴 СИЛЬНОЕ ДВИЖЕНИЕ"
                      )

                  elif abs(change_60m) >= 5:
                      level = (
                          "🟠 РЕЗКОЕ ДВИЖЕНИЕ"
                      )

                  if level:

                      direction = (
                          "📈 РОСТ"
                          if change_60m > 0
                          else "📉 ПАДЕНИЕ"
                      )

                      alerts.append(
                          f"{level}\n"
                          f"{direction}: {coin}/USDT\n"
                          f"Цена: ${current_price:,.8f}\n"
                          f"30 мин: {change_30m:+.2f}%\n"
                          f"60 мин: {change_60m:+.2f}%\n"
                          f"Объём: {volume_ratio:.1f}x среднего"
                      )

                  elif (
                      volume_ratio >= 3 and
                      abs(change_60m) >= 3
                  ):

                      direction = (
                          "📈" if change_60m > 0
                          else "📉"
                      )

                      alerts.append(
                          "⚠️ АНОМАЛЬНЫЙ ОБЪЁМ\n"
                          f"{direction} {coin}/USDT\n"
                          f"Цена: ${current_price:,.8f}\n"
                          f"60 мин: {change_60m:+.2f}%\n"
                          f"Объём: {volume_ratio:.1f}x среднего"
                      )

                  print(
                      f"{symbol}: "
                      f"30m={change_30m:+.2f}% "
                      f"60m={change_60m:+.2f}% "
                      f"volume={volume_ratio:.1f}x"
                  )

              except Exception as error:

                  print(
                      f"{symbol}: ERROR: {error}"
                  )

          # --------------------------------------------------
          # Telegram message
          # --------------------------------------------------

          if alerts:

              now = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%d %H:%M UTC"
              )

              message = (
                  "🚀 UNCLE GOO CRYPTO MONITOR\n\n"
                  +
                  "\n\n".join(alerts)
                  +
                  f"\n\n⏱ {now}"
              )

              if unavailable:
                  message += (
                      "\n\n⚠️ Нет пары на Bitget: "
                      + ", ".join(unavailable)
                  )

              send_message(
                  chat_id,
                  message
              )

              print("\n" + message)

          else:

              print(
                  "No alerts."
              )

              if unavailable:
                  print(
                      "Unavailable on Bitget: "
                      + ", ".join(unavailable)
                  )

          PY
