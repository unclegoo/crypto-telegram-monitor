              )

              result = subprocess.run(
                  [
                      'git',
                      'diff',
                      '--cached',
                      '--quiet'
                  ],
                  check=False
              )

              if result.returncode == 0:
                  print(
                      'No state changes to commit.'
                  )
                  return

              subprocess.run(
                  [
                      'git',
                      'commit',
                      '-m',
                      'Update crypto monitor state'
                  ],
                  check=False
              )

              subprocess.run(
                  [
                      'git',
                      'push'
                  ],
                  check=False
              )


          # ============================================================
          # BITGET
          # ============================================================

          def get_candles(symbol):
              data = http_get_json(
                  BITGET_CANDLES_URL,
                  params={
                      'category': 'SPOT',
                      'symbol': symbol,
                      'interval': '1m',
                      'limit': 80,
                  },
                  timeout=20
              )

              rows = data.get(
                  'data',
                  []
              )

              candles = []

              for row in rows:
                  try:
                      timestamp = int(
                          row[0]
                      )

                      close = float(
                          row[4]
                      )

                      candles.append(
                          (
                              datetime.fromtimestamp(
                                  timestamp / 1000,
                                  tz=timezone.utc
                              ),
                              close
                          )
                      )

                  except Exception:
                      continue

              candles.sort(
                  key=lambda x: x[0]
              )

              return candles


          def get_ticker(symbol):
              data = http_get_json(
                  BITGET_TICKER_URL,
                  params={
                      'category': 'SPOT',
                      'symbol': symbol,
                  },
                  timeout=20
              )

              rows = data.get(
                  'data',
                  []
              )

              if not rows:
                  raise RuntimeError(
                      f'No ticker data for {symbol}'
                  )

              row = rows[0]

              value = row.get(
                  'lastPrice'
              )

              if value is None:
                  raise RuntimeError(
                      f'No lastPrice for {symbol}'
                  )

              return float(
                  value
              )


          def get_historical_close(
              candles,
              target_time
          ):
              completed = [
                  (
                      timestamp,
                      close
                  )
                  for timestamp, close
                  in candles
                  if timestamp <= target_time
              ]

              if not completed:
                  raise RuntimeError(
                      f'No completed 1m candle for '
                      f'{target_time.isoformat()}'
                  )

              return completed[-1]


          def calculate_market(symbol):
              price = get_ticker(
                  symbol
              )

              candles = get_candles(
                  symbol
              )

              now = datetime.now(
                  timezone.utc
              )

              periods = [
                  5,
                  15,
                  30,
                  45,
                  60,
              ]

              result = {
                  'symbol': symbol,
                  'price': price,
                  'market_time': now,
                  'historical_times': {},
              }

              for minutes in periods:
                  target_time = (
                      now -
                      timedelta(
                          minutes=minutes
                      )
                  )

                  historical_time, historical_close = (
                      get_historical_close(
                          candles,
                          target_time
                      )
                  )

                  change = (
                      (
                          price -
                          historical_close
                      )
                      /
                      historical_close
                      *
                      100
                  )

                  result[
                      f'change_{minutes}'
                  ] = change

                  result[
                      'historical_times'
                  ][minutes] = (
                      historical_time
                  )

              return result


          # ============================================================
          # PRICE SIGNALS
          # ============================================================

          def get_level(
              change,
              sharp,
              strong,
              very_strong,
              extreme
          ):
              absolute = abs(
                  change
              )

              if absolute >= extreme:
                  return 'EXTREME'

              if absolute >= very_strong:
                  return 'VERY STRONG'

              if absolute >= strong:
                  return 'STRONG'

              if absolute >= sharp:
                  return 'SHARP'

              return None


          def get_price_alerts(
              market
          ):
              alerts = []

              levels = [
                  (
                      '5m',
                      market['change_5'],
                      SHARP_5,
                      STRONG_5,
                      VERY_STRONG_5,
                      EXTREME_5,
                  ),
                  (
                      '15m',
                      market['change_15'],
                      SHARP_15,
                      STRONG_15,
                      VERY_STRONG_15,
                      EXTREME_15,
                  ),
                  (
                      '30m',
                      market['change_30'],
                      SHARP_30,
                      STRONG_30,
                      VERY_STRONG_30,
                      EXTREME_30,
                  ),
                  (
                      '45m',
                      market['change_45'],
                      SHARP_45,
                      STRONG_45,
                      VERY_STRONG_45,
                      EXTREME_45,
                  ),
                  (
                      '60m',
                      market['change_60'],
                      SHARP_60,
                      STRONG_60,
                      VERY_STRONG_60,
                      EXTREME_60,
                  ),
              ]

              for (
                  period,
                  change,
                  sharp,
                  strong,
                  very_strong,
                  extreme
              ) in levels:

                  level = get_level(
                      change,
                      sharp,
                      strong,
                      very_strong,
                      extreme
                  )

                  if level:
                      alerts.append(
                          (
                              level,
                              change,
                              period
                          )
                      )

              return alerts


          # ============================================================
          # SIGNAL STRENGTH
          # ============================================================

          def calculate_signal_strength(
              price_alerts,
              news_article=None
          ):
              if not price_alerts:
                  return 'LOW'

              severity = {
                  'SHARP': 1,
                  'STRONG': 2,
                  'VERY STRONG': 3,
                  'EXTREME': 4,
              }

              strongest = max(
                  price_alerts,
                  key=lambda x: (
                      severity.get(
                          x[0],
                          0
                      ),
                      abs(x[1])
                  )
              )

              base_score = severity.get(
                  strongest[0],
                  0
              )

              directions = []

              for (
                  level,
                  change,
                  period
              ) in price_alerts:

                  if change > 0:
                      directions.append(
                          'UP'
                      )

                  elif change < 0:
                      directions.append(
                          'DOWN'
                      )

              if len(
                  price_alerts
              ) >= 2:
                  base_score += 1

              if news_article:
                  base_score += 1

              if base_score >= 7:
                  return 'EXTREME'

              if base_score >= 5:
                  return 'VERY HIGH'

              if base_score >= 4:
                  return 'HIGH'

              if base_score >= 3:
                  return 'MEDIUM'

              return 'LOW'


          # ============================================================
          # NEWS HELPERS
          # ============================================================

          def clean_text(text):
              if not text:
                  return ''

              text = re.sub(
                  r'<[^>]+>',
                  ' ',
                  text
              )

              text = re.sub(
                  r'\s+',
                  ' ',
                  text
              )

              return text.strip()


          def parse_news_date(value):
              if not value:
                  return None

              value = value.strip()

              try:
                  dt = parsedate_to_datetime(
                      value
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  pass

              formats = [
                  '%Y-%m-%dT%H:%M:%S%z',
                  '%Y-%m-%dT%H:%M:%SZ',
                  '%Y-%m-%d %H:%M:%S',
                  '%Y-%m-%d',
              ]

              for fmt in formats:
                  try:
                      dt = datetime.strptime(
                          value,
                          fmt
                      )

                      if dt.tzinfo is None:
                          dt = dt.replace(
                              tzinfo=timezone.utc
                          )

                      return dt.astimezone(
                          timezone.utc
                      )

                  except Exception:
                      continue

              return None


          def news_fingerprint(
              article,
              symbol
          ):
              raw = (
                  f"{symbol}|"
                  f"{article.get('title', '')}|"
                  f"{article.get('link', '')}"
              )

              return hashlib.sha256(
                  raw.encode(
                      'utf-8'
                  )
              ).hexdigest()


          def detect_news_signal(
              text
          ):
              lowered = (
                  text or ''
              ).lower()

              for (
                  signal,
                  keywords
              ) in NEWS_SIGNALS:

                  for keyword in keywords:
                      if keyword.lower() in lowered:
                          return signal

              return None


          def article_matches_symbol(
              article,
              symbol
          ):
              text = (
                  article.get(
                      'title',
                      ''
                  )
                  + ' '
                  +
                  article.get(
                      'description',
                      ''
                  )
              ).lower()

              coin_key = (
                  symbol.replace(
                      'USDT',
                      ''
                  )
              )

              keywords = NEWS_KEYWORDS.get(
                  coin_key,
                  []
              )

              for keyword in keywords:
                  if keyword.lower() in text:
                      return True

              return False


          def parse_rss(
              content,
              source
          ):
              articles = []

              try:
                  root = ET.fromstring(
                      content
                  )

              except Exception as e:
                  print(
                      f'RSS parse error '
                      f'{source}: {e}'
                  )
                  return articles

              for item in root.iter():
                  if item.tag.lower().endswith(
                      'item'
                  ):

                      title = ''
                      description = ''
                      link = ''
                      pub_date = None

                      for child in item:
                          tag = child.tag.lower()

                          if tag.endswith(
                              'title'
                          ):
                              title = clean_text(
                                  child.text or ''
                              )

                          elif tag.endswith(
                              'description'
                          ):
                              description = clean_text(
                                  child.text or ''
                              )

                          elif tag.endswith(
                              'link'
                          ):
                              link = (
                                  child.text or ''
                              ).strip()

                          elif (
                              tag.endswith(
                                  'pubdate'
                              )
                              or
                              tag.endswith(
                                  'published'
                              )
                              or
                              tag.endswith(
                                  'updated'
                              )
                          ):
                              pub_date = parse_news_date(
                                  child.text
                                  or ''
                              )

                      if title:
                          articles.append(
                              {
                                  'source': source,
                                  'title': title,
                                  'description':
                                      description,
                                  'link': link,
                                  'published':
                                      pub_date,
                              }
                          )

              return articles


          def collect_rss_news():
              all_articles = []

              for (
                  source,
                  url
              ) in NEWS_FEEDS:

                  try:
                      content = http_get_text(
                          url,
                          timeout=NEWS_TIMEOUT
                      )

                      articles = parse_rss(
                          content,
                          source
                      )

                      all_articles.extend(
                          articles
                      )

                  except Exception as e:
                      print(
                          f'News feed error '
                          f'{source}: {e}'
                      )

              return all_articles


          def collect_crypto_ru_news():
              articles = []

              try:
                  content = http_get_text(
                      CRYPTO_RU_NEWS_URL,
                      timeout=NEWS_TIMEOUT
                  )

                  text = content.decode(
                      'utf-8',
                      errors='ignore'
                  )

                  pattern = re.compile(
                      r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>'
                      r'(.*?)</a>',
                      re.IGNORECASE |
                      re.DOTALL
                  )

                  for match in pattern.finditer(
                      text
                  ):
                      link = match.group(
                          1
                      )

                      title = clean_text(
                          match.group(
                              2
                          )
                      )

                      if not title:
                          continue

                      if link.startswith('/'):
                          link = (
                              'https://crypto.ru'
                              + link
                          )

                      if (
                          'crypto.ru'
                          not in link
                      ):
                          continue

                      articles.append(
                          {
                              'source':
                                  'Crypto.ru',
                              'title':
                                  title,
                              'description':
                                  '',
                              'link':
                                  link,
                              'published':
                                  None,
                          }
                      )

              except Exception as e:
                  print(
                      f'Crypto.ru error: '
                      f'{e}'
                  )

              return articles


          def collect_news():
              now = datetime.now(
                  timezone.utc
              )

              cutoff = (
                  now -
                  timedelta(
                      hours=
                      NEWS_LOOKBACK_HOURS
                  )
              )

              articles = (
                  collect_rss_news()
              )

              articles.extend(
                  collect_crypto_ru_news()
              )

              context = {}

              seen = set()

              for article in articles:

                  title = article.get(
                      'title',
                      ''
                  )

                  link = article.get(
                      'link',
                      ''
                  )

                  unique = (
                      title.lower(),
                      link.lower()
                  )

                  if unique in seen:
                      continue

                  seen.add(
                      unique
                  )

                  published = article.get(
                      'published'
                  )

                  if (
                      published
                      and
                      published < cutoff
                  ):
                      continue

                  text = (
                      title
                      + ' '
                      +
                      article.get(
                          'description',
                          ''
                      )
                  )

                  signal = (
                      detect_news_signal(
                          text
                      )
                  )

                  if not signal:
                      continue

                  article['signal'] = signal

                  for symbol in SYMBOLS:

                      if article_matches_symbol(
                          article,
                          symbol
                      ):

                          context.setdefault(
                              symbol,
                              []
                          ).append(
                              article
                          )

              for symbol in context:
                  context[symbol].sort(
                      key=lambda article:
                          article.get(
                              'published'
                          )
                          or
                          datetime.min.replace(
                              tzinfo=timezone.utc
                          ),
                      reverse=True
                  )

              return context


          def format_news_line(
              article
          ):
              signal = article.get(
                  'signal',
                  '📰 NEWS'
              )

              title = article.get(
                  'title',
                  'Без заголовка'
              )

              source = article.get(
                  'source',
                  ''
              )

              link = article.get(
                  'link',
                  ''
              )

              message = (
                  f'{signal}\n'
                  f'📰 {title}\n'
                  f'Источник: {source}'
              )

              if link:
                  message += (
                      '\n'
                      + link
                  )

              return message


          # ============================================================
          # PRICE MESSAGE
          # ============================================================

          def send_price_alert(
              state,
              symbol,
              market,
              level,
              change,
              period,
              price_alerts,
              news_article=None,
              signal_type='PRICE'
          ):
              price = market[
                  'price'
              ]

              direction = (
                  '📈'
                  if change > 0
                  else
                  '📉'
              )

              signal_strength = (
                  calculate_signal_strength(
                      price_alerts,
                      news_article
                  )
              )

              fingerprint = (
                  f'{symbol}:'
                  f'{signal_type}:'
                  f'{level}:'
                  f'{period}:'
                  f'{direction}'
              )

              if alert_already_sent(
                  state,
                  fingerprint
              ):
                  return False

              message = (
                  f'{direction} '
                  f'{symbol}\n\n'
                  f'💰 Цена: '
                  f'{price:.10g}\n\n'
                  f'5m: '
                  f'{market["change_5"]:+.2f}%\n'
                  f'15m: '
                  f'{market["change_15"]:+.2f}%\n'
                  f'30m: '
                  f'{market["change_30"]:+.2f}%\n'
                  f'45m: '
                  f'{market["change_45"]:+.2f}%\n'
                  f'60m: '
                  f'{market["change_60"]:+.2f}%\n\n'
                  f'🟠 {level} MOVE\n'
                  f'🔥 Сила сигнала: '
                  f'{signal_strength}\n'
                  f'⏱ Период: {period}'
              )

              if news_article:

                  message += (
                      '\n\n'
                      '📰 Фундаментальный фактор:\n'
                      +
                      format_news_line(
                          news_article
                      )
                  )

              link = (
                  news_article.get(
                      'link'
                  )
                  if news_article
                  else None
              )

              if link:
                  message += (
                      '\n'
                      + link
                  )

              message += (
                  '\n\nBitget Spot'
              )

              print(
                  '\nPRICE ALERT:\n'
                  + message
              )

              try:
                  success = send_telegram(
                      message
                  )

                  if success:

                      actual_fingerprint = (
                          f'{symbol}:'
                          f'{signal_type}:'
                          f'{level}:'
                          f'{period}:'
                          f'{direction}'
                      )

                      mark_alert_sent(
                          state,
                          actual_fingerprint
                      )

                      if (
                          actual_fingerprint
                          != fingerprint
                      ):
                          mark_alert_sent(
                              state,
                              fingerprint
                          )

                      if news_article:
                          fp = news_fingerprint(
                              news_article,
                              symbol
                          )

                          mark_news_sent(
                              state,
                              fp
                          )

                      return True

              except Exception as e:
                  print(
                      f'Telegram price error: '
                      f'{e}'
                  )

              return False


          # ============================================================
          # STANDALONE FUNDAMENTAL NEWS
          # ============================================================

          def send_standalone_news(
              state,
              news_context,
              combined_news
          ):
              news_sent = 0

              for symbol in SYMBOLS:

                  if (
                      news_sent
                      >=
                      MAX_NEWS_ALERTS_PER_RUN
                  ):
                      break

                  for article in news_context.get(
                      symbol,
                      []
                  ):

                      if (
                          news_sent
                          >=
                          MAX_NEWS_ALERTS_PER_RUN
                      ):
                          break

                      fp = news_fingerprint(
                          article,
                          symbol
                      )

                      if fp in combined_news:
                          continue

                      if news_already_sent(
                          state,
                          fp
                      ):
                          continue

                      message = (
                          '📰 FUNDAMENTAL EVENT\n\n'
                          f'🪙 {symbol}\n\n'
                          f'{format_news_line(article)}\n\n'
                          'Цена пока не показывает '
                          'достаточного движения.\n\n'
                          'Bitget Spot'
                      )

                      print(
                          '\nNEWS ALERT:\n'
                          + message
                      )

                      try:
                          success = send_telegram(
                              message
                          )

                          if success:
                              mark_news_sent(
                                  state,
                                  fp
                              )

                              news_sent += 1

                      except Exception as e:
                          print(
                              f'Telegram news error: '
                              f'{e}'
                          )

              return news_sent


