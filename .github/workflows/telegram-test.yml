          def clean_text(text):
              if not text:
                  return ''

              text = re.sub(
                  r'<[^>]+>',
                  ' ',
                  text
              )

              text = re.sub(
                  r'\s+',
                  ' ',
                  text
              )

              return text.strip()


          def parse_news_date(value):
              if not value:
                  return None

              value = value.strip()

              try:
                  dt = parsedate_to_datetime(
                      value
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  pass

              formats = [
                  '%Y-%m-%dT%H:%M:%S%z',
                  '%Y-%m-%dT%H:%M:%SZ',
                  '%Y-%m-%d %H:%M:%S',
                  '%Y-%m-%d',
              ]

              for fmt in formats:
                  try:
                      dt = datetime.strptime(
                          value,
                          fmt
                      )

                      if dt.tzinfo is None:
                          dt = dt.replace(
                              tzinfo=timezone.utc
                          )

                      return dt.astimezone(
                          timezone.utc
                      )

                  except Exception:
                      continue

              return None


          def news_fingerprint(
              article,
              symbol
          ):
              raw = (
                  f"{symbol}|"
                  f"{article.get('title', '')}|"
                  f"{article.get('link', '')}"
              )

              return hashlib.sha256(
                  raw.encode(
                      'utf-8'
                  )
              ).hexdigest()


          def detect_news_signal(
              text
          ):
              lowered = (
                  text or ''
              ).lower()

              for (
                  signal,
                  keywords
              ) in NEWS_SIGNALS:

                  for keyword in keywords:
                      if keyword.lower() in lowered:
                          return signal

              return None


          def article_matches_symbol(
              article,
              symbol
          ):
              text = (
                  article.get(
                      'title',
                      ''
                  )
                  + ' '
                  +
                  article.get(
                      'description',
                      ''
                  )
              ).lower()

              coin_key = (
                  symbol.replace(
                      'USDT',
                      ''
                  )
              )

              keywords = NEWS_KEYWORDS.get(
                  coin_key,
                  []
              )

              for keyword in keywords:
                  pattern = r'\b' + re.escape(keyword.lower()) + r'\b'

                  if re.search(pattern, text):
                      return True

              return False


          def parse_rss(
              content,
              source
          ):
              articles = []

              try:
                  root = ET.fromstring(
                      content
                  )

              except Exception as e:
                  print(
                      f'RSS parse error '
                      f'{source}: {e}'
                  )
                  return articles

              for item in root.iter():
                  if item.tag.lower().endswith(
                      'item'
                  ):

                      title = ''
                      description = ''
                      link = ''
                      pub_date = None

                      for child in item:
                          tag = child.tag.lower()

                          if tag.endswith(
                              'title'
                          ):
                              title = clean_text(
                                  child.text or ''
                              )

                          elif tag.endswith(
                              'description'
                          ):
                              description = clean_text(
                                  child.text or ''
                              )

                          elif tag.endswith(
                              'link'
                          ):
                              link = (
                                  child.text or ''
                              ).strip()

                          elif (
                              tag.endswith(
                                  'pubdate'
                              )
                              or
                              tag.endswith(
                                  'published'
                              )
                              or
                              tag.endswith(
                                  'updated'
                              )
                          ):
                              pub_date = parse_news_date(
                                  child.text
                                  or ''
                              )

                      if title:
                          articles.append(
                              {
                                  'source': source,
                                  'title': title,
                                  'description':
                                      description,
                                  'link': link,
                                  'published':
                                      pub_date,
                              }
                          )

              return articles


          def collect_rss_news():
              all_articles = []

              for (
                  source,
                  url
              ) in NEWS_FEEDS:

                  try:
                      content = http_get_text(
                          url,
                          timeout=NEWS_TIMEOUT
                      )

                      articles = parse_rss(
                          content,
                          source
                      )

                      all_articles.extend(
                          articles
                      )

                  except Exception as e:
                      print(
                          f'News feed error '
                          f'{source}: {e}'
                      )

              return all_articles


          def collect_crypto_ru_news():
              articles = []

              try:
                  content = http_get_text(
                      CRYPTO_RU_NEWS_URL,
                      timeout=NEWS_TIMEOUT
                  )

                  text = content.decode(
                      'utf-8',
                      errors='ignore'
                  )

                  pattern = re.compile(
                      r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>'
                      r'(.*?)</a>',
                      re.IGNORECASE |
                      re.DOTALL
                  )

                  for match in pattern.finditer(
                      text
                  ):
                      link = match.group(
                          1
                      )

                      title = clean_text(
                          match.group(
                              2
                          )
                      )

                      if not title:
                          continue

                      if link.startswith('/'):
                          link = (
                              'https://crypto.ru'
                              + link
                          )

                      if (
                          'crypto.ru'
                          not in link
                      ):
                          continue

                      articles.append(
                          {
                              'source':
                                  'Crypto.ru',
                              'title':
                                  title,
                              'description':
                                  '',
                              'link':
                                  link,
                              'published':
                                  None,
                          }
                      )

              except Exception as e:
                  print(
                      f'Crypto.ru error: '
                      f'{e}'
                  )

              return articles


          def collect_news():
              now = datetime.now(
                  timezone.utc
              )

              cutoff = (
                  now -
                  timedelta(
                      hours=
                      NEWS_LOOKBACK_HOURS
                  )
              )

              articles = (
                  collect_rss_news()
              )

              articles.extend(
                  collect_crypto_ru_news()
              )

              context = {}

              seen = set()

              for article in articles:

                  title = article.get(
                      'title',
                      ''
                  )

                  link = article.get(
                      'link',
                      ''
                  )

                  unique = (
                      title.lower(),
                      link.lower()
                  )

                  if unique in seen:
                      continue

                  seen.add(
                      unique
                  )

                  published = article.get(
                      'published'
                  )

                  if (
                      published
                      and
                      published < cutoff
                  ):
                      continue

                  text = (
                      title
                      + ' '
                      +
                      article.get(
                          'description',
                          ''
                      )
                  )

                  signal = (
                      detect_news_signal(
                          text
                      )
                  )

                  if not signal:
                      continue

                  article['signal'] = signal

                  for symbol in SYMBOLS:

                      if article_matches_symbol(
                          article,
                          symbol
                      ):

                          context.setdefault(
                              symbol,
                              []
                          ).append(
                              article
                          )

              for symbol in context:
                  context[symbol].sort(
                      key=lambda article:
                          article.get(
                              'published'
                          )
                          or
                          datetime.min.replace(
                              tzinfo=timezone.utc
                          ),
                      reverse=True
                  )

              return context


          def format_news_line(
              article
          ):
              signal = article.get(
                  'signal',
                  '📰 NEWS'
              )

              title = article.get(
                  'title',
                  'Без заголовка'
              )

              source = article.get(
                  'source',
                  ''
              )

              link = article.get(
                  'link',
                  ''
              )

              message = (
                  f'{signal}\n'
                  f'📰 {title}\n'
                  f'Источник: {source}'
              )

              if link:
                  message += (
                      '\n'
                      + link
                  )

              return message


