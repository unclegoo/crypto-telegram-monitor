name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Отправить тестовое сообщение в Telegram"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: uncle-goo-crypto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import subprocess
          from datetime import datetime, timezone, timedelta


          # ============================================================
          # SETTINGS
          # ============================================================

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]

          TEST_TELEGRAM = (
              os.environ.get("TEST_TELEGRAM", "").lower() == "true"
          )

          BASE = "https://api.bitget.com"

          STATE_FILE = ".crypto_monitor_state.json"

          ALERT_COOLDOWN_MINUTES = 60

          COINS = [
              "BTC",
              "ETH",
              "XRP",
              "ETC",
              "FIL",
              "ETHFI",
              "ONDO",
              "TWT",
              "XLM",
              "ARKM",
              "GRAM",
              "STRK",
              "ARB",
              "STX",
              "RENDER",
              "JUP",
              "PYTH",
              "FET",
              "PEPE",
              "MANTA",
              "ZK",
              "HYPE"
          ]


          # ============================================================
          # HTTP
          # ============================================================

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Uncle-Goo-Crypto-Monitor/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          def post_json(url, data):
              body = urllib.parse.urlencode(
                  data
              ).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "User-Agent":
                      "Uncle-Goo-Crypto-Monitor/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # ============================================================
          # TELEGRAM
          # ============================================================

          def prepare_telegram_polling():

              url = (
                  f"https://api.telegram.org/bot"
                  f"{TOKEN}/getWebhookInfo"
              )

              result = get_json(url)

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram getWebhookInfo error: {result}"
                  )

              webhook_url = (
                  result
                  .get("result", {})
                  .get("url", "")
              )

              if webhook_url:

                  delete_url = (
                      f"https://api.telegram.org/bot"
                      f"{TOKEN}/deleteWebhook"
                  )

                  delete_result = post_json(
                      delete_url,
                      {
                          "drop_pending_updates": "false"
                      }
                  )

                  if not delete_result.get("ok"):
                      raise RuntimeError(
                          "Unable to remove Telegram webhook: "
                          f"{delete_result}"
                      )


          def get_chat_id():

              prepare_telegram_polling()

              url = (
                  f"https://api.telegram.org/bot"
                  f"{TOKEN}/getUpdates"
              )

              result = get_json(url)

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram getUpdates error: {result}"
                  )

              updates = result.get(
                  "result",
                  []
              )

              for update in reversed(updates):

                  message = update.get(
                      "message",
                      {}
                  )

                  chat = message.get(
                      "chat",
                      {}
                  )

                  if chat.get("type") == "private":

                      chat_id = chat.get("id")

                      if chat_id is not None:
                          return str(chat_id)

              raise RuntimeError(
                  "Telegram chat_id not found. "
                  "Open the bot and send /start first."
              )


          def send_telegram(text):

              chat_id = get_chat_id()

              url = (
                  f"https://api.telegram.org/bot"
                  f"{TOKEN}/sendMessage"
              )

              result = post_json(
                  url,
                  {
                      "chat_id": chat_id,
                      "text": text
                  }
              )

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram sendMessage error: {result}"
                  )

              print(
                  "Telegram message sent successfully."
              )


          # ============================================================
          # STATE
          # ============================================================

          def load_state():

              if not os.path.exists(
                  STATE_FILE
              ):

                  return {}

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as file:

                      data = json.load(file)

                  if isinstance(data, dict):
                      return data

              except Exception as error:

                  print(
                      f"State read error: {error}"
                  )

              return {}


          def save_state(state):

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      state,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )


          def should_send_alert(
              state,
              fingerprint
          ):

              item = state.get(
                  fingerprint
              )

              if not item:
                  return True

              last_sent = item.get(
                  "sent_at"
              )

              if not last_sent:
                  return True

              try:

                  last_time = datetime.fromisoformat(
                      last_sent
                  )

              except Exception:

                  return True

              now = datetime.now(
                  timezone.utc
              )

              elapsed = (
                  now - last_time
              ).total_seconds() / 60

              if elapsed >= ALERT_COOLDOWN_MINUTES:
                  return True

              remaining = (
                  ALERT_COOLDOWN_MINUTES
                  - elapsed
              )

              print(
                  f"Duplicate suppressed: "
                  f"{fingerprint} "
                  f"({remaining:.0f} min remaining)"
              )

              return False


          def mark_alert_sent(
              state,
              fingerprint
          ):

              state[fingerprint] = {
                  "sent_at": datetime.now(
                      timezone.utc
                  ).isoformat()
              }


          # ============================================================
          # SAVE STATE TO GITHUB
          # ============================================================

          def save_state_to_github():

              try:

                  subprocess.run(
                      [
                          "git",
                          "config",
                          "user.name",
                          "github-actions[bot]"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "config",
                          "user.email",
                          "41898282+github-actions[bot]"
                          "@users.noreply.github.com"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "add",
                          STATE_FILE
                      ],
                      check=True
                  )

                  result = subprocess.run(
                      [
                          "git",
                          "diff",
                          "--cached",
                          "--quiet"
                      ]
                  )

                  if result.returncode == 0:

                      print(
                          "State unchanged."
                      )

                      return

                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Update crypto monitor state"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push"
                      ],
                      check=True
                  )

                  print(
                      "State saved to GitHub."
                  )

              except Exception as error:

                  print(
                      f"State GitHub save error: {error}"
                  )
                  raise


          # ============================================================
          # BITGET
          # ============================================================

          def get_candles(symbol):

              url = (
                  BASE
                  + "/api/v3/market/candles?"
                  + urllib.parse.urlencode(
                      {
                          "category": "SPOT",
                          "symbol": symbol,
                          "interval": "5m",
                          "limit": "13"
                      }
                  )
              )

              result = get_json(
                  url
              )

              if result.get("code") != "00000":

                  raise RuntimeError(
                      f"Bitget error for {symbol}: "
                      f"{result}"
                  )

              return result.get(
                  "data",
                  []
              )


          # ============================================================
          # TELEGRAM TEST
          # ============================================================

          if TEST_TELEGRAM:

              test_message = (
                  "🚀 UNCLE GOO CRYPTO MONITOR\n\n"
                  "✅ Telegram работает.\n"
                  "✅ Бот успешно получает сообщения.\n"
                  "✅ Защита от повторных уведомлений включена.\n"
                  "✅ Монитор работает каждые 5 минут."
              )

              send_telegram(
                  test_message
              )

              print(
                  "Telegram test completed successfully."
              )

              raise SystemExit(0)


          # ============================================================
          # LOAD STATE
          # ============================================================

          state = load_state()

          alerts_to_send = []

          state_changed = False


          # ============================================================
          # MARKET MONITOR
          # ============================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "UNCLE GOO CRYPTO MONITOR"
          )
          print(
              "=========================================="
          )
          print("")


          for coin in COINS:

              symbol = coin + "USDT"

              try:

                  data = get_candles(
                      symbol
                  )

                  if len(data) < 13:

                      print(
                          f"{symbol}: "
                          "not enough candle data"
                      )

                      continue


                  # Bitget returns newest first.
                  data = list(
                      reversed(data)
                  )


                  # 5-minute candles.
                  #
                  # 12 intervals = 60 minutes.
                  # 6 intervals  = 30 minutes.

                  old_60 = float(
                      data[0][4]
                  )

                  old_30 = float(
                      data[6][4]
                  )

                  current = float(
                      data[-1][4]
                  )


                  if (
                      old_60 <= 0
                      or old_30 <= 0
                  ):

                      print(
                          f"{symbol}: "
                          "invalid price data"
                      )

                      continue


                  change_60 = (
                      (
                          current
                          / old_60
                      ) - 1
                  ) * 100


                  change_30 = (
                      (
                          current
                          / old_30
                      ) - 1
                  ) * 100


                  # ==================================================
                  # VOLUME
                  # ==================================================

                  volumes = [
                      float(candle[5])
                      for candle in data[:-1]
                  ]

                  current_volume = float(
                      data[-1][5]
                  )

                  if volumes:

                      avg_volume = (
                          sum(volumes)
                          / len(volumes)
                      )

                  else:

                      avg_volume = 0


                  if avg_volume > 0:

                      volume_ratio = (
                          current_volume
                          / avg_volume
                      )

                  else:

                      volume_ratio = 0


                  # ==================================================
                  # ALERT DETECTION
                  # ==================================================

                  alert_text = None

                  fingerprint = None


                  # EXTREME
                  if abs(change_60) >= 12:

                      level = (
                          "🚨 ЭКСТРЕМАЛЬНОЕ ДВИЖЕНИЕ"
                      )

                      direction = (
                          "📈 РОСТ"
                          if change_60 > 0
                          else "📉 ПАДЕНИЕ"
                      )

                      fingerprint = (
                          f"{coin}:extreme:"
                          f"{'up' if change_60 > 0 else 'down'}"
                      )

                      alert_text = (
                          f"{level}\n"
                          f"{direction}: "
                          f"{coin}/USDT\n"
                          f"Цена: "
                          f"${current:,.8f}\n"
                          f"30 мин: "
                          f"{change_30:+.2f}%\n"
                          f"60 мин: "
                          f"{change_60:+.2f}%\n"
                          f"Объём: "
                          f"{volume_ratio:.1f}x среднего"
                      )


                  # STRONG
                  elif abs(change_30) >= 8:

                      level = (
                          "🔴 СИЛЬНОЕ ДВИЖЕНИЕ"
                      )

                      direction = (
                          "📈 РОСТ"
                          if change_30 > 0
                          else "📉 ПАДЕНИЕ"
                      )

                      fingerprint = (
                          f"{coin}:strong:"
                          f"{'up' if change_30 > 0 else 'down'}"
                      )

                      alert_text = (
                          f"{level}\n"
                          f"{direction}: "
                          f"{coin}/USDT\n"
                          f"Цена: "
                          f"${current:,.8f}\n"
                          f"30 мин: "
                          f"{change_30:+.2f}%\n"
                          f"60 мин: "
                          f"{change_60:+.2f}%\n"
                          f"Объём: "
                          f"{volume_ratio:.1f}x среднего"
                      )


                  # SHARP
                  elif abs(change_60) >= 5:

                      level = (
                          "🟠 РЕЗКОЕ ДВИЖЕНИЕ"
                      )

                      direction = (
                          "📈 РОСТ"
                          if change_60 > 0
                          else "📉 ПАДЕНИЕ"
                      )

                      fingerprint = (
                          f"{coin}:sharp:"
                          f"{'up' if change_60 > 0 else 'down'}"
                      )

                      alert_text = (
                          f"{level}\n"
                          f"{direction}: "
                          f"{coin}/USDT\n"
                          f"Цена: "
                          f"${current:,.8f}\n"
                          f"30 мин: "
                          f"{change_30:+.2f}%\n"
                          f"60 мин: "
                          f"{change_60:+.2f}%\n"
                          f"Объём: "
                          f"{volume_ratio:.1f}x среднего"
                      )


                  # ABNORMAL VOLUME
                  elif (
                      volume_ratio >= 3
                      and abs(change_60) >= 3
                  ):

                      direction = (
                          "📈"
                          if change_60 > 0
                          else "📉"
                      )

                      fingerprint = (
                          f"{coin}:volume:"
                          f"{'up' if change_60 > 0 else 'down'}"
                      )

                      alert_text = (
                          "⚠️ АНОМАЛЬНЫЙ ОБЪЁМ\n"
                          f"{direction} "
                          f"{coin}/USDT\n"
                          f"Цена: "
                          f"${current:,.8f}\n"
                          f"60 мин: "
                          f"{change_60:+.2f}%\n"
                          f"Объём: "
                          f"{volume_ratio:.1f}x среднего"
                      )


                  # ==================================================
                  # DEDUPLICATION
                  # ==================================================

                  if (
                      alert_text
                      and fingerprint
                  ):

                      if should_send_alert(
                          state,
                          fingerprint
                      ):

                          alerts_to_send.append(
                              alert_text
                          )

                          mark_alert_sent(
                              state,
                              fingerprint
                          )

                          state_changed = True


                  # ==================================================
                  # LOG
                  # ==================================================

                  print(
                      f"{symbol}: "
                      f"30m={change_30:+.2f}% "
                      f"60m={change_60:+.2f}% "
                      f"volume={volume_ratio:.1f}x"
                  )


              except Exception as error:

                  print(
                      f"{symbol}: ERROR: "
                      f"{error}"
                  )


          # ============================================================
          # SEND ALERTS
          # ============================================================

          if alerts_to_send:

              now = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%d %H:%M UTC"
              )

              message = (
                  "🚀 UNCLE GOO CRYPTO MONITOR\n\n"
                  + "\n\n".join(
                      alerts_to_send
                  )
                  + f"\n\n⏱ {now}"
              )

              send_telegram(
                  message
              )

              print("")
              print(
                  "ALERT SENT TO TELEGRAM"
              )
              print("")

          else:

              print("")
              print(
                  "No new alerts."
              )
              print("")


          # ============================================================
          # SAVE DEDUPLICATION STATE
          # ============================================================

          if state_changed:

              save_state(
                  state
              )

              save_state_to_github()

          else:

              print(
                  "No state changes."
              )

          PY
