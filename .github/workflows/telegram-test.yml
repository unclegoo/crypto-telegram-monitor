          # ============================================================
          # HTTP
          # ============================================================

          def http_get_json(
              url,
              params=None,
              timeout=20
          ):

              if params:
                  url += "?" + urllib.parse.urlencode(
                      params
                  )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Uncle-Goo-Crypto-Monitor/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:

                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          def http_get_text(
              url,
              timeout=20
          ):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 Uncle-Goo-Crypto-Monitor/1.0",
                      "Accept":
                          "application/rss+xml, application/xml, "
                          "text/html, text/xml, */*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:

                  return response.read()


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_api(
              method,
              payload=None
          ):

              if not TELEGRAM_BOT_TOKEN:

                  print(
                      "TELEGRAM_BOT_TOKEN is not configured."
                  )

                  return {}


              url = (
                  "https://api.telegram.org/"
                  f"bot{TELEGRAM_BOT_TOKEN}/{method}"
              )

              data = None

              if payload is not None:

                  data = urllib.parse.urlencode(
                      payload
                  ).encode(
                      "utf-8"
                  )


              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "User-Agent":
                          "Uncle-Goo-Crypto-Monitor/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          def get_chat_id():

              result = telegram_api(
                  "getUpdates"
              )

              updates = result.get(
                  "result",
                  []
              )

              if not updates:
                  return None

              for update in reversed(
                  updates
              ):

                  message = update.get(
                      "message"
                  )

                  if (
                      message
                      and
                      message.get("chat")
                  ):

                      return message[
                          "chat"
                      ]["id"]

              return None


          def send_telegram(text):

              chat_id = get_chat_id()

              if chat_id is None:

                  print(
                      "Telegram chat ID not found."
                  )

                  print(
                      "Send /start to the bot first."
                  )

                  return False


              result = telegram_api(
                  "sendMessage",
                  {
                      "chat_id": chat_id,
                      "text": text,
                      "disable_web_page_preview":
                          False,
                  },
              )

              return result.get(
                  "ok",
                  False
              )


          # ============================================================
          # STATE
          # ============================================================

          def load_state():

              if not os.path.exists(
                  STATE_FILE
              ):

                  return {
                      "alerts": {},
                      "news": {},
                  }


              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      raw = json.load(
                          f
                      )


                  if (
                      "alerts" not in raw
                      and
                      "news" not in raw
                  ):

                      return {
                          "alerts": raw,
                          "news": {},
                      }


                  raw.setdefault(
                      "alerts",
                      {}
                  )

                  raw.setdefault(
                      "news",
                      {}
                  )

                  return raw


              except Exception:

                  return {
                      "alerts": {},
                      "news": {},
                  }


          def save_state(
              state
          ):

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )


          def save_state_to_github():

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE,
                  ],
                  check=True,
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet",
                  ]
              )

              if result.returncode == 0:
                  return

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update crypto monitor state",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                  ],
                  check=True,
              )


          # ============================================================
          # DEDUPLICATION
          # ============================================================

          def should_send_alert(
              state,
              fingerprint
          ):

              item = state[
                  "alerts"
              ].get(
                  fingerprint
              )

              if not item:
                  return True

              try:

                  sent_at = datetime.fromisoformat(
                      item["sent_at"]
                  )

                  now = datetime.now(
                      timezone.utc
                  )

                  age = (
                      now - sent_at
                  ).total_seconds() / 60

                  return (
                      age
                      >= ALERT_COOLDOWN_MINUTES
                  )

              except Exception:

                  return True


          def mark_alert_sent(
              state,
              fingerprint
          ):

              state[
                  "alerts"
              ][fingerprint] = {
                  "sent_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat()
              }


          # ============================================================
          # BITGET
          # ============================================================

          def get_ticker(
              symbol
          ):

              data = http_get_json(
                  BITGET_TICKER_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                  },
              )

              if data.get(
                  "code"
              ) != "00000":

                  raise RuntimeError(
                      f"Bitget ticker error: {data}"
                  )


              rows = data.get(
                  "data",
                  []
              )

              if not rows:

                  raise RuntimeError(
                      f"No ticker data for {symbol}"
                  )


              last_price = rows[
                  0
              ].get(
                  "lastPrice"
              )

              if last_price is None:

                  raise RuntimeError(
                      f"No lastPrice for {symbol}"
                  )


              return float(
                  last_price
              )


          def get_candles(
              symbol
          ):

              data = http_get_json(
                  BITGET_CANDLES_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                      "interval": "5m",
                      "limit": 30,
                  },
              )

              if data.get(
                  "code"
              ) != "00000":

                  raise RuntimeError(
                      f"Bitget candle error: {data}"
                  )


              candles = data.get(
                  "data",
                  []
              )

              if len(candles) < 13:

                  raise RuntimeError(
                      f"Not enough candles for "
                      f"{symbol}: {len(candles)}"
                  )


              candles = sorted(
                  candles,
                  key=lambda c:
                      int(c[0])
              )


              closes = [
                  float(c[4])
                  for c in candles
              ]

              volumes = [
                  float(c[5])
                  for c in candles
              ]


              return (
                  closes,
                  volumes
              )


          def calculate_market(
              symbol
          ):

              price_now = get_ticker(
                  symbol
              )

              closes, volumes = get_candles(
                  symbol
              )


              # Last completed 5-minute candle
              price_5 = closes[-2]

              # 15 minutes = 3 x 5m
              price_15 = closes[-4]

              # 30 minutes = 6 x 5m
              price_30 = closes[-7]

              # 45 minutes = 9 x 5m
              price_45 = closes[-10]

              # 60 minutes = 12 x 5m
              price_60 = closes[-13]


              change_5 = (
                  (
                      price_now /
                      price_5
                  ) - 1
              ) * 100


              change_15 = (
                  (
                      price_now /
                      price_15
                  ) - 1
              ) * 100


              change_30 = (
                  (
                      price_now /
                      price_30
                  ) - 1
              ) * 100


              change_45 = (
                  (
                      price_now /
                      price_45
                  ) - 1
              ) * 100


              change_60 = (
                  (
                      price_now /
                      price_60
                  ) - 1
              ) * 100


              # 30-minute volume comparison:
              # last 6 completed 5m candles
              # versus previous 6.
              current_volume = sum(
                  volumes[-7:-1]
              )

              previous_volume = sum(
                  volumes[-13:-7]
              )


              if previous_volume > 0:

                  volume_ratio = (
                      current_volume /
                      previous_volume
                  )

              else:

                  volume_ratio = 0


              return {

                  "price":
                      price_now,

                  "change_5":
                      change_5,

                  "change_15":
                      change_15,

                  "change_30":
                      change_30,

                  "change_45":
                      change_45,

                  "change_60":
                      change_60,

                  "volume_ratio":
                      volume_ratio,
              }


          # ============================================================
          # TEXT / DATE
          # ============================================================

          def clean_text(
              text
          ):

              if not text:
                  return ""

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def parse_date(
              value
          ):

              if not value:
                  return None

              value = value.strip()


              try:

                  dt = parsedate_to_datetime(
                      value
                  )

                  if dt.tzinfo is None:

                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  pass


              try:

                  value = value.replace(
                      "Z",
                      "+00:00"
                  )

                  dt = datetime.fromisoformat(
                      value
                  )

                  if dt.tzinfo is None:

                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:

                  return None


          # ============================================================
          # RSS PARSER
          # ============================================================

          def parse_feed(
              source_name,
              url
          ):

              raw = http_get_text(
                  url,
                  timeout=NEWS_TIMEOUT
              )

              root = ET.fromstring(
                  raw
              )

              articles = []


              # RSS
              for item in root.findall(
                  ".//item"
              ):

                  title = clean_text(
                      item.findtext(
                          "title"
                      )
                  )

                  link = clean_text(
                      item.findtext(
                          "link"
                      )
                  )

                  description = clean_text(
                      item.findtext(
                          "description"
                      )
                  )

                  pub_date = (
                      item.findtext(
                          "pubDate"
                      )
                      or
                      item.findtext(
                          "published"
                      )
                      or
                      item.findtext(
                          "updated"
                      )
                  )

                  dt = parse_date(
                      pub_date
                  )

                  if title:

                      articles.append(
                          {
                              "source":
                                  source_name,

                              "title":
                                  title,

                              "link":
                                  link,

                              "description":
                                  description,

                              "date":
                                  dt,
                          }
                      )


              # Atom
              if not articles:

                  ns = {
                      "atom":
                          "http://www.w3.org/2005/Atom"
                  }


                  for entry in root.findall(
                      ".//atom:entry",
                      ns
                  ):

                      title_node = entry.find(
                          "atom:title",
                          ns
                      )

                      title = clean_text(
                          title_node.text
                          if title_node
                          is not None
                          else ""
                      )


                      link = ""

                      link_node = entry.find(
                          "atom:link",
                          ns
                      )

                      if link_node is not None:

                          link = (
                              link_node.attrib.get(
                                  "href",
                                  ""
                              )
                          )


                      summary_node = entry.find(
                          "atom:summary",
                          ns
                      )

                      description = clean_text(
                          summary_node.text
                          if summary_node
                          is not None
                          else ""
                      )


                      published_node = entry.find(
                          "atom:published",
                          ns
                      )

                      updated_node = entry.find(
                          "atom:updated",
                          ns
                      )


                      date_value = ""

                      if published_node is not None:

                          date_value = (
                              published_node.text
                              or ""
                          )

                      elif updated_node is not None:

                          date_value = (
                              updated_node.text
                              or ""
                          )


                      dt = parse_date(
                          date_value
                      )


                      if title:

                          articles.append(
                              {
                                  "source":
                                      source_name,

                                  "title":
                                      title,

                                  "link":
                                      link,

                                  "description":
                                      description,

                                  "date":
                                      dt,
                              }
                          )


              return articles


          # ============================================================
          # CRYPTO.RU PARSER
          # ============================================================

          def parse_crypto_ru():

              raw = http_get_text(
                  CRYPTO_RU_NEWS_URL,
                  timeout=NEWS_TIMEOUT
              )

              html = raw.decode(
                  "utf-8",
                  errors="ignore"
              )


              articles = []

              seen_links = set()


              # --------------------------------------------------------
              # First try article containers.
              # --------------------------------------------------------

              container_pattern = re.compile(
                  r'<article\b[^>]*>'
                  r'(.*?)'
                  r'</article>',
                  re.IGNORECASE |
                  re.DOTALL
              )


              containers = (
                  container_pattern.findall(
                      html
                  )
              )


              for container in containers:

                  links = re.findall(
                      r'href=["\']'
                      r'(https://crypto\.ru/[^"\']+|/news/[^"\']+)'
                      r'["\']',
                      container,
                      re.IGNORECASE
                  )


                  if not links:
                      continue


                  link = links[0]


                  if link.startswith("/"):
                      link = (
                          "https://crypto.ru"
                          + link
                      )


                  if "/news/" not in link:
                      continue


                  if link in seen_links:
                      continue


                  title_match = re.search(
                      r'<(?:h1|h2|h3|h4)'
                      r'[^>]*>'
                      r'(.*?)'
                      r'</(?:h1|h2|h3|h4)>',
                      container,
                      re.IGNORECASE |
                      re.DOTALL
                  )


                  if title_match:

                      title = clean_text(
                          title_match.group(
                              1
                          )
                      )

                  else:

                      title = ""


                  if len(title) < 10:

                      text_links = re.findall(
                          r'<a\b[^>]*>'
                          r'(.*?)'
                          r'</a>',
                          container,
                          re.IGNORECASE |
                          re.DOTALL
                      )

                      for candidate in text_links:

                          candidate = clean_text(
                              candidate
                          )

                          if len(
                              candidate
                          ) >= 10:

                              title = candidate
                              break


                  if len(title) < 10:
                      continue


                  # Search date inside article block.
                  dt = None


                  date_match = re.search(
                      r'(\d{1,2}\.\d{1,2}\.\d{4})'
                      r'(?:\s+|[^0-9]{0,20})'
                      r'(\d{1,2}:\d{2})?',
                      container
                  )


                  if date_match:

                      date_part = (
                          date_match.group(
                              1
                          )
                      )

                      time_part = (
                          date_match.group(
                              2
                          )
                          or
                          "00:00"
                      )


                      try:

                          naive = datetime.strptime(
                              date_part
                              + " "
                              + time_part,
                              "%d.%m.%Y %H:%M"
                          )

                          dt = naive.replace(
                              tzinfo=timezone.utc
                          )

                      except Exception:
                          dt = None


                  articles.append(
                      {
                          "source":
                              "Crypto.ru",

                          "title":
                              title,

                          "link":
                              link,

                          "description":
                              "",

                          "date":
                              dt,
                      }
                  )


                  seen_links.add(
                      link
                  )


              # --------------------------------------------------------
              # Fallback generic link parser.
              # --------------------------------------------------------

              if len(articles) < 5:

                  pattern = re.compile(
                      r'href=["\']'
                      r'(https://crypto\.ru/[^"\']+|/news/[^"\']+)'
                      r'["\'][^>]*>'
                      r'\s*(?:<[^>]+>\s*)*'
                      r'([^<]{10,300})',
                      re.IGNORECASE |
                      re.DOTALL
                  )


                  for match in pattern.finditer(
                      html
                  ):

                      link = match.group(
                          1
                      )

                      title = clean_text(
                          match.group(
                              2
                          )
                      )


                      if link.startswith("/"):
                          link = (
                              "https://crypto.ru"
                              + link
                          )


                      if "/news/" not in link:
                          continue


                      if len(title) < 10:
                          continue


                      if link in seen_links:
                          continue


                      articles.append(
                          {
                              "source":
                                  "Crypto.ru",

                              "title":
                                  title,

                              "link":
                                  link,

                              "description":
                                  "",

                              "date":
                                  None,
                          }
                      )


                      seen_links.add(
                          link
                      )


                      if len(
                          articles
                      ) >= 50:

                          break


              return articles


          # ============================================================
          # NEWS MATCHING
          # ============================================================

          def article_coin_matches(
              article,
              symbol
          ):

              coin = symbol.replace(
                  "USDT",
                  ""
              )

              keywords = NEWS_KEYWORDS.get(
                  coin,
                  []
              )


              text = (
                  article.get(
                      "title",
                      ""
                  )
                  + " "
                  + article.get(
                      "description",
                      ""
                  )
              ).lower()


              for keyword in keywords:

                  keyword = keyword.lower()

                  if keyword in text:
                      return True


              return False


          def detect_news_signal(
              article
          ):

              text = (
                  article.get(
                      "title",
                      ""
                  )
                  + " "
                  + article.get(
                      "description",
                      ""
                  )
              ).lower()


              for (
                  signal_name,
                  keywords
              ) in NEWS_SIGNALS:

                  for keyword in keywords:

                      if (
                          keyword.lower()
                          in text
                      ):

                          return signal_name


              return None


          def news_fingerprint(
              article,
              symbol
          ):

              raw = (
                  symbol
                  + "|"
                  + article.get(
                      "source",
                      ""
                  )
                  + "|"
                  + article.get(
                      "title",
                      ""
                  )
              )


              return hashlib.sha256(
                  raw.encode(
                      "utf-8"
                  )
              ).hexdigest()


          # ============================================================
          # COLLECT NEWS CONTEXT
          # ============================================================

          def collect_news():

              now = datetime.now(
                  timezone.utc
              )

              cutoff = (
                  now -
                  timedelta(
                      hours=
                          NEWS_LOOKBACK_HOURS
                  )
              )


              all_articles = []


              for (
                  source_name,
                  feed_url
              ) in NEWS_FEEDS:

                  try:

                      articles = parse_feed(
                          source_name,
                          feed_url
                      )

                      print(
                          f"{source_name}: "
                          f"{len(articles)} articles"
                      )

                      all_articles.extend(
                          articles
                      )

                  except Exception as e:

                      print(
                          f"NEWS ERROR "
                          f"{source_name}: "
                          f"{e}"
                      )


              try:

                  articles = parse_crypto_ru()

                  print(
                      f"Crypto.ru: "
                      f"{len(articles)} articles"
                  )

                  all_articles.extend(
                      articles
                  )

              except Exception as e:

                  print(
                      f"NEWS ERROR "
                      f"Crypto.ru: {e}"
                  )


              # Newest first
              all_articles.sort(
                  key=lambda a: (
                      a.get("date")
                      or
                      datetime.min.replace(
                          tzinfo=timezone.utc
                      )
                  ),
                  reverse=True
              )


              fresh = []


              for article in all_articles:

                  article_date = article.get(
                      "date"
                  )


                  if article_date is None:
                      continue


                  if article_date < cutoff:
                      continue


                  signal = detect_news_signal(
                      article
                  )


                  if not signal:
                      continue


                  article[
                      "signal"
                  ] = signal


                  fresh.append(
                      article
                  )


              context = {}


              for symbol in SYMBOLS:

                  matches = []


                  for article in fresh:

                      if article_coin_matches(
                          article,
                          symbol
                      ):

                          matches.append(
                              article
                          )


                  context[
                      symbol
                  ] = matches


              print(
                  f"Fresh significant news: "
                  f"{len(fresh)}"
              )


              return context


          # ============================================================
          # NEWS STATE
          # ============================================================

          def news_already_sent(
              state,
              fingerprint
          ):

              return (
                  fingerprint
                  in state["news"]
              )


          def mark_news_sent(
              state,
              fingerprint
          ):

              state[
                  "news"
              ][fingerprint] = {
                  "sent_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat()
              }


          # ============================================================
          # FORMAT NEWS
          # ============================================================

          def format_news_line(
              article
          ):

              source = article.get(
                  "source",
                  "News"
              )

              title = article.get(
                  "title",
                  ""
              )

              link = article.get(
                  "link",
                  ""
              )

              signal = article.get(
                  "signal",
                  "📰 NEWS"
              )


              result = (
                  f"{signal}\n\n"
                  f"📰 {title}\n\n"
                  f"Источник: {source}"
              )


              if link:
                  result += "\n" + link


              return result


          # ============================================================
          # PRICE ALERT CLASSIFICATION
          # ============================================================

          def classify_change(
              change,
              sharp,
              strong,
              very_strong,
              extreme
          ):

              value = abs(change)


              if value >= extreme:

                  return "EXTREME"

              if value >= very_strong:

                  return "VERY STRONG"

              if value >= strong:

                  return "STRONG"

              if value >= sharp:

                  return "SHARP"


              return None


          def get_price_alerts(
              market
          ):

              periods = [
                  (
                      "5m",
                      market["change_5"],
                      SHARP_5,
                      STRONG_5,
                      VERY_STRONG_5,
                      EXTREME_5,
                  ),
                  (
                      "15m",
                      market["change_15"],
                      SHARP_15,
                      STRONG_15,
                      VERY_STRONG_15,
                      EXTREME_15,
                  ),
                  (
                      "30m",
                      market["change_30"],
                      SHARP_30,
                      STRONG_30,
                      VERY_STRONG_30,
                      EXTREME_30,
                  ),
                  (
                      "45m",
                      market["change_45"],
                      SHARP_45,
                      STRONG_45,
                      VERY_STRONG_45,
                      EXTREME_45,
                  ),
                  (
                      "60m",
                      market["change_60"],
                      SHARP_60,
                      STRONG_60,
                      VERY_STRONG_60,
                      EXTREME_60,
                  ),
              ]


              alerts = []


              for (
                  period,
                  change,
                  sharp,
                  strong,
                  very_strong,
                  extreme
              ) in periods:

                  level = classify_change(
                      change,
                      sharp,
                      strong,
                      very_strong,
                      extreme
                  )


                  if level:

                      alerts.append(
                          (
                              level,
                              change,
                              period
                          )
                      )


              return alerts


          # ============================================================
          # SIGNAL STRENGTH
          # ============================================================

          def calculate_signal_strength(
              primary_level,
              price_alerts,
              volume_signal,
              fresh_news
          ):

              severity = {
                  "SHARP": 1,
                  "STRONG": 2,
                  "VERY STRONG": 3,
                  "EXTREME": 4,
              }


              score = severity.get(
                  primary_level,
                  0
              )


              # More than one timeframe confirms
              # the move.
              if len(price_alerts) >= 2:
                  score += 1


              # Abnormal volume confirmation.
              if volume_signal:
                  score += 1


              # Fundamental news confirmation.
              if fresh_news:
                  score += 1


              if score >= 7:
                  return "EXTREME"

              if score >= 5:
                  return "VERY HIGH"

              if score >= 4:
                  return "HIGH"

              if score >= 3:
                  return "MEDIUM"

              return "LOW"


          # ============================================================
          # PRICE SNAPSHOT
          # ============================================================

          def format_price_snapshot(
              market
          ):

              return (
                  f"5m: "
                  f"{market['change_5']:+.2f}%\n"
                  f"15m: "
                  f"{market['change_15']:+.2f}%\n"
                  f"30m: "
                  f"{market['change_30']:+.2f}%\n"
                  f"45m: "
                  f"{market['change_45']:+.2f}%\n"
                  f"60m: "
                  f"{market['change_60']:+.2f}%"
              )


