name: Telegram Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          api = f"https://api.telegram.org/bot{token}"

          with urllib.request.urlopen(
              f"{api}/getUpdates",
              timeout=20
          ) as response:
              updates = json.load(response)

          if not updates.get("ok"):
              raise SystemExit(f"Telegram API error: {updates}")

          messages = []

          for update in updates.get("result", []):
              message = update.get("message")
              if message and message.get("chat"):
                  messages.append(message)

          if not messages:
              raise SystemExit(
                  "No Telegram messages found. Open the bot and send /start first."
              )

          chat_id = messages[-1]["chat"]["id"]

          text = "🚀 Uncle Goo Crypto Monitor: тестовое сообщение работает!"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text
          }).encode()

          request = urllib.request.Request(
              f"{api}/sendMessage",
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise SystemExit(f"Telegram send error: {result}")

          print("Telegram test message sent successfully")
          PY
