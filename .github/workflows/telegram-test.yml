name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          python3 << 'PY'
          import os
          import json
          import re
          import subprocess
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
