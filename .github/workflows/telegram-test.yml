name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import subprocess
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime


          # ============================================================
          # CONFIG
          # ============================================================

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          TEST_TELEGRAM = os.environ.get("TEST_TELEGRAM", "").lower() == "true"

          STATE_FILE = ".crypto_monitor_state.json"

          BITGET_CANDLES_URL = "https://api.bitget.com/api/v3/market/candles"
          BITGET_TICKER_URL = "https://api.bitget.com/api/v3/market/tickers"

          NEWS_FEEDS = [
              ("РБК", "https://rssexport.rbc.ru/rbcnews/news/30/full.rss"),
              ("Investing.com", "https://ru.investing.com/rss/news_301.rss"),
              ("ForkLog", "https://forklog.com/feed"),
          ]

          NEWS_LOOKBACK_HOURS = 2
          MAX_NEWS_ALERTS_PER_RUN = 3
          NEWS_TIMEOUT = 20

          # One identical alert per direction/level per hour.
          ALERT_COOLDOWN_MINUTES = 60


          # ============================================================
          # PRICE ALERT LEVELS
          # ============================================================

          # 5-minute alerts
          SHARP_5 = 3.0
          STRONG_5 = 5.0
          VERY_STRONG_5 = 8.0
          EXTREME_5 = 10.0

          # 30-minute / 60-minute backup alerts
          STRONG_30 = 8.0
          SHARP_60 = 5.0
          EXTREME_60 = 12.0

          # Abnormal volume
          ABNORMAL_VOLUME_RATIO = 3.0
          ABNORMAL_VOLUME_MOVE = 3.0


          # ============================================================
          # COINS
          # ============================================================

          SYMBOLS = [
              "BTCUSDT",
              "ETHUSDT",
              "XRPUSDT",
              "ETCUSDT",
              "FILUSDT",
              "ETHFIUSDT",
              "ONDOUSDT",
              "TWTUSDT",
              "XLMUSDT",
              "ARKMUSDT",
              "GRAMUSDT",
              "STRKUSDT",
              "ARBUSDT",
              "STXUSDT",
              "RENDERUSDT",
              "JUPUSDT",
              "PYTHUSDT",
              "FETUSDT",
              "PEPEUSDT",
              "MANTAUSDT",
              "ZKUSDT",
              "HYPEUSDT",
          ]


          # ============================================================
          # NEWS KEYWORDS
          # ============================================================

          NEWS_KEYWORDS = {
              "BTC": [
                  "bitcoin",
                  "btc",
                  "биткоин",
                  "биткойн",
              ],
              "ETH": [
                  "ethereum",
                  "ether",
                  "eth",
                  "эфириум",
                  "эфир",
              ],
              "XRP": [
                  "xrp",
                  "ripple",
                  "рипл",
              ],
              "ETC": [
                  "ethereum classic",
                  "ethereum classic",
                  "etc",
              ],
              "FIL": [
                  "filecoin",
                  "file coin",
                  "fil",
              ],
              "ETHFI": [
                  "ether.fi",
                  "etherfi",
                  "ethfi",
              ],
              "ONDO": [
                  "ondo finance",
                  "ondo",
              ],
              "TWT": [
                  "trust wallet",
                  "trustwallet",
                  "twt",
              ],
              "XLM": [
                  "stellar",
                  "xlm",
                  "стеллар",
              ],
              "ARKM": [
                  "arkham",
                  "arkm",
              ],
              "GRAM": [
                  "gram token",
                  "gram cryptocurrency",
                  "gram crypto",
                  "gram",
              ],
              "STRK": [
                  "starknet",
                  "strk",
              ],
              "ARB": [
                  "arbitrum",
                  "арбітрум",
                  "arb",
              ],
              "STX": [
                  "stacks",
                  "stx",
              ],
              "RENDER": [
                  "render network",
                  "render token",
                  "render",
              ],
              "JUP": [
                  "jupiter exchange",
                  "jupiter crypto",
                  "jupiter",
              ],
              "PYTH": [
                  "pyth network",
                  "pyth",
              ],
              "FET": [
                  "fetch.ai",
                  "fetch ai",
                  "artificial superintelligence alliance",
                  "asi",
                  "fet",
              ],
              "PEPE": [
                  "pepe coin",
                  "pepe token",
                  "pepe crypto",
                  "pepe",
              ],
              "MANTA": [
                  "manta network",
                  "manta",
              ],
              "ZK": [
                  "zksync",
                  "zk sync",
                  "zk",
              ],
              "HYPE": [
                  "hyperliquid",
                  "hype",
              ],
          }


          # ============================================================
          # NEWS SIGNALS
          # Listing/delisting and token unlocks intentionally removed.
          # ============================================================

          NEWS_SIGNALS = [
              (
                  "🚨 SECURITY",
                  [
                      "hack",
                      "hacked",
                      "exploit",
                      "exploited",
                      "vulnerability",
                      "breach",
                      "stolen",
                      "stole",
                      "attack",
                      "attacked",
                      "drained",
                      "compromised",
                      "security flaw",
                      "funds stolen",
                      "network halted",
                      "взлом",
                      "взломали",
                      "эксплойт",
                      "уязвимость",
                      "украдены",
                      "атак",
                      "атака",
                      "скомпрометирован",
                      "украл",
                      "краж",
                  ],
              ),
              (
                  "⚖️ REGULATION",
                  [
                      "sec",
                      "cftc",
                      "regulator",
                      "regulation",
                      "regulatory",
                      "lawsuit",
                      "court",
                      "legal",
                      "ban",
                      "banned",
                      "approval",
                      "etf",
                      "регулятор",
                      "регулирован",
                      "суд",
                      "иск",
                      "запрет",
                      "разрешение",
                      "одобрение",
                  ],
              ),
              (
                  "🏦 INSTITUTIONAL",
                  [
                      "institutional",
                      "institution",
                      "asset manager",
                      "etf",
                      "treasury",
                      "fund",
                      "институцион",
                      "инвестфонд",
                      "фонд",
                  ],
              ),
              (
                  "💰 FUNDING / INVESTMENT",
                  [
                      "funding",
                      "investment",
                      "investor",
                      "raises",
                      "raised",
                      "financing",
                      "capital",
                      "финансирован",
                      "инвестици",
                      "инвестор",
                      "раунд",
                      "капитал",
                  ],
              ),
              (
                  "🤝 PARTNERSHIP",
                  [
                      "partnership",
                      "partner",
                      "partners",
                      "integration",
                      "collaboration",
                      "партнер",
                      "партнёр",
                      "интеграци",
                      "сотрудничеств",
                  ],
              ),
              (
                  "🚀 NETWORK UPDATE",
                  [
                      "upgrade",
                      "hard fork",
                      "mainnet",
                      "testnet",
                      "launch",
                      "released",
                      "release",
                      "обновлен",
                      "обновление",
                      "хардфорк",
                      "мейннет",
                      "тестнет",
                      "запуск",
                      "релиз",
                  ],
              ),
          ]


          # ============================================================
          # HTTP
          # ============================================================

          def http_get_json(url, params=None, timeout=20):
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Uncle-Goo-Crypto-Monitor/1.0"
                  },
              )

              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))


          def http_get_text(url, timeout=20):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Uncle-Goo-Crypto-Monitor/1.0",
                      "Accept": "application/rss+xml, application/xml, text/xml, */*",
                  },
              )

              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_api(method, payload=None):
              if not TELEGRAM_BOT_TOKEN:
                  print("TELEGRAM_BOT_TOKEN is not configured.")
                  return {}

              url = (
                  f"https://api.telegram.org/"
                  f"bot{TELEGRAM_BOT_TOKEN}/{method}"
              )

              data = None

              if payload is not None:
                  data = urllib.parse.urlencode(payload).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "User-Agent": "Uncle-Goo-Crypto-Monitor/1.0"
                  },
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))


          def get_chat_id():
              result = telegram_api("getUpdates")

              updates = result.get("result", [])

              if not updates:
                  return None

              for update in reversed(updates):
                  message = update.get("message")

                  if message and message.get("chat"):
                      return message["chat"]["id"]

              return None


          def send_telegram(text):
              chat_id = get_chat_id()

              if chat_id is None:
                  print("Telegram chat ID not found.")
                  print("Send /start to the bot first.")
                  return False

              result = telegram_api(
                  "sendMessage",
                  {
                      "chat_id": chat_id,
                      "text": text,
                      "disable_web_page_preview": False,
                  },
              )

              return result.get("ok", False)


          # ============================================================
          # STATE
          # ============================================================

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      "alerts": {},
                      "news": {},
                  }

              try:
                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8",
                  ) as f:
                      raw = json.load(f)

                  if "alerts" not in raw and "news" not in raw:
                      return {
                          "alerts": raw,
                          "news": {},
                      }

                  raw.setdefault("alerts", {})
                  raw.setdefault("news", {})

                  return raw

              except Exception:
                  return {
                      "alerts": {},
                      "news": {},
                  }


          def save_state(state):
              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )


          def save_state_to_github():
              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE,
                  ],
                  check=True,
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet",
                  ]
              )

              if result.returncode == 0:
                  return

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update crypto monitor state",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                  ],
                  check=True,
              )


          # ============================================================
          # ALERT DEDUPLICATION
          # ============================================================

          def should_send_alert(state, fingerprint):
              item = state["alerts"].get(fingerprint)

              if not item:
                  return True

              try:
                  sent_at = datetime.fromisoformat(
                      item["sent_at"]
                  )

                  now = datetime.now(timezone.utc)

                  age = (
                      now - sent_at
                  ).total_seconds() / 60

                  return age >= ALERT_COOLDOWN_MINUTES

              except Exception:
                  return True


          def mark_alert_sent(state, fingerprint):
              state["alerts"][fingerprint] = {
                  "sent_at": datetime.now(
                      timezone.utc
                  ).isoformat()
              }


          # ============================================================
          # BITGET MARKET DATA
          # ============================================================

          def get_ticker(symbol):
              data = http_get_json(
                  BITGET_TICKER_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                  },
              )

              if data.get("code") != "00000":
                  raise RuntimeError(
                      f"Bitget ticker error: {data}"
                  )

              rows = data.get("data", [])

              if not rows:
                  raise RuntimeError(
                      f"No ticker data for {symbol}"
                  )

              last_price = rows[0].get("lastPrice")

              if last_price is None:
                  raise RuntimeError(
                      f"No lastPrice for {symbol}"
                  )

              return float(last_price)


          def get_candles(symbol):
              data = http_get_json(
                  BITGET_CANDLES_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                      "interval": "5m",
                      "limit": 30,
                  },
              )

              if data.get("code") != "00000":
                  raise RuntimeError(
                      f"Bitget candle error: {data}"
                  )

              candles = data.get("data", [])

              if len(candles) < 13:
                  raise RuntimeError(
                      f"Not enough candles for {symbol}: "
                      f"{len(candles)}"
                  )

              # IMPORTANT:
              # Never blindly reverse Bitget candles.
              # Sort explicitly by timestamp so the oldest candle
              # is first and newest candle is last.
              candles = sorted(
                  candles,
                  key=lambda c: int(c[0]),
              )

              closes = [
                  float(c[4])
                  for c in candles
              ]

              volumes = [
                  float(c[5])
                  for c in candles
              ]

              return closes, volumes


          def calculate_market(symbol):
              # Current live price comes from ticker.
              # This prevents an old candle close from being
              # interpreted as the current price.
              price_now = get_ticker(symbol)

              closes, volumes = get_candles(symbol)

              # 5m candle immediately before the newest candle
              price_5 = closes[-2]

              # 30 minutes = 6 x 5-minute intervals
              price_30 = closes[-7]

              # 60 minutes = 12 x 5-minute intervals
              price_60 = closes[-13]

              change_5 = (
                  (price_now / price_5) - 1
              ) * 100

              change_30 = (
                  (price_now / price_30) - 1
              ) * 100

              change_60 = (
                  (price_now / price_60) - 1
              ) * 100

              # Current 30-minute volume
              current_volume = sum(
                  volumes[-6:]
              )

              # Previous 30-minute volume
              previous_volume = sum(
                  volumes[-12:-6]
              )

              if previous_volume > 0:
                  volume_ratio = (
                      current_volume /
                      previous_volume
                  )
              else:
                  volume_ratio = 0

              return {
                  "price": price_now,
                  "change_5": change_5,
                  "change_30": change_30,
                  "change_60": change_60,
                  "volume_ratio": volume_ratio,
              }


          # ============================================================
          # NEWS
          # ============================================================

          def clean_text(text):
              if not text:
                  return ""

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text,
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text,
              )

              return text.strip()


          def parse_date(value):
              if not value:
                  return None

              value = value.strip()

              try:
                  dt = parsedate_to_datetime(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  pass

              try:
                  value = value.replace(
                      "Z",
                      "+00:00",
                  )

                  dt = datetime.fromisoformat(
                      value
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  return None


          def parse_feed(source_name, url):
              raw = http_get_text(
                  url,
                  timeout=NEWS_TIMEOUT,
              )

              root = ET.fromstring(raw)

              articles = []

              # RSS
              for item in root.findall(
                  ".//item"
              ):
                  title = clean_text(
                      item.findtext("title")
                  )

                  link = clean_text(
                      item.findtext("link")
                  )

                  description = clean_text(
                      item.findtext("description")
                  )

                  pub_date = (
                      item.findtext("pubDate")
                      or item.findtext("published")
                      or item.findtext("updated")
                  )

                  dt = parse_date(pub_date)

                  if title:
                      articles.append(
                          {
                              "source": source_name,
                              "title": title,
                              "link": link,
                              "description": description,
                              "date": dt,
                          }
                      )

              # Atom
              if not articles:
                  ns = {
                      "atom": "http://www.w3.org/2005/Atom"
                  }

                  for entry in root.findall(
                      ".//atom:entry",
                      ns,
                  ):
                      title_node = entry.find(
                          "atom:title",
                          ns,
                      )

                      title = clean_text(
                          title_node.text
                          if title_node is not None
                          else ""
                      )

                      link = ""

                      link_node = entry.find(
                          "atom:link",
                          ns,
                      )

                      if link_node is not None:
                          link = (
                              link_node.attrib.get(
                                  "href",
                                  "",
                              )
                          )

                      summary_node = entry.find(
                          "atom:summary",
                          ns,
                      )

                      description = clean_text(
                          summary_node.text
                          if summary_node is not None
                          else ""
                      )

                      published_node = entry.find(
                          "atom:published",
                          ns,
                      )

                      updated_node = entry.find(
                          "atom:updated",
                          ns,
                      )

                      date_value = ""

                      if published_node is not None:
                          date_value = (
                              published_node.text
                              or ""
                          )

                      elif updated_node is not None:
                          date_value = (
                              updated_node.text
                              or ""
                          )

                      dt = parse_date(
                          date_value
                      )

                      if title:
                          articles.append(
                              {
                                  "source": source_name,
                                  "title": title,
                                  "link": link,
                                  "description": description,
                                  "date": dt,
                              }
                          )

              return articles


          def article_coin_matches(
              article,
              symbol,
          ):
              coin = symbol.replace(
                  "USDT",
                  "",
              )

              keywords = NEWS_KEYWORDS.get(
                  coin,
                  [],
              )

              text = (
                  article.get("title", "")
                  + " "
                  + article.get("description", "")
              ).lower()

              for keyword in keywords:
                  keyword = keyword.lower()

                  if keyword in text:
                      return True

              return False


          def detect_news_signal(article):
              text = (
                  article.get("title", "")
                  + " "
                  + article.get("description", "")
              ).lower()

              for signal_name, keywords in NEWS_SIGNALS:
                  for keyword in keywords:
                      if keyword.lower() in text:
                          return signal_name

              return None


          def news_fingerprint(article, symbol):
              raw = (
                  symbol
                  + "|"
                  + article.get("source", "")
                  + "|"
                  + article.get("title", "")
              )

              import hashlib

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          def format_news(
              article,
              symbol,
              signal,
          ):
              source = article.get(
                  "source",
                  "News",
              )

              title = article.get(
                  "title",
                  "",
              )

              link = article.get(
                  "link",
                  "",
              )

              return (
                  f"{signal}\n\n"
                  f"🪙 {symbol}\n"
                  f"📰 {title}\n\n"
                  f"Источник: {source}\n"
                  f"{link}"
              )


          def process_news(state):
              news_sent = 0

              now = datetime.now(
                  timezone.utc
              )

              cutoff = (
                  now -
                  timedelta(
                      hours=NEWS_LOOKBACK_HOURS
                  )
              )

              all_articles = []

              for source_name, feed_url in NEWS_FEEDS:
                  try:
                      articles = parse_feed(
                          source_name,
                          feed_url,
                      )

                      print(
                          f"{source_name}: "
                          f"{len(articles)} articles"
                      )

                      all_articles.extend(
                          articles
                      )

                  except Exception as e:
                      print(
                          f"NEWS ERROR "
                          f"{source_name}: {e}"
                      )

              # Newest first
              all_articles.sort(
                  key=lambda a: (
                      a.get("date")
                      or datetime.min.replace(
                          tzinfo=timezone.utc
                      )
                  ),
                  reverse=True,
              )

              for article in all_articles:

                  if news_sent >= MAX_NEWS_ALERTS_PER_RUN:
                      break

                  article_date = article.get(
                      "date"
                  )

                  if article_date is not None:
                      if article_date < cutoff:
                          continue

                  signal = detect_news_signal(
                      article
                  )

                  if not signal:
                      continue

                  for symbol in SYMBOLS:

                      if news_sent >= MAX_NEWS_ALERTS_PER_RUN:
                          break

                      if not article_coin_matches(
                          article,
                          symbol,
                      ):
                          continue

                      fingerprint = (
                          news_fingerprint(
                              article,
                              symbol,
                          )
                      )

                      if fingerprint in state["news"]:
                          continue

                      message = format_news(
                          article,
                          symbol,
                          signal,
                      )

                      print(
                          "\nNEWS ALERT:\n"
                          + message
                      )

                      try:
                          success = send_telegram(
                              message
                          )

                          if success:
                              state["news"][
                                  fingerprint
                              ] = {
                                  "sent_at":
                                      datetime.now(
                                          timezone.utc
                                      ).isoformat()
                              }

                              news_sent += 1

                      except Exception as e:
                          print(
                              f"Telegram news error: {e}"
                          )

              return news_sent


          # ============================================================
          # TEST TELEGRAM
          # ============================================================

          if TEST_TELEGRAM:
              test_message = (
                  "🚀 Uncle Goo Crypto Monitor\n\n"
                  "Тестовое сообщение работает!\n\n"
                  "Мониторинг:\n"
                  "• Bitget Spot\n"
                  "• 5m / 30m / 60m\n"
                  "• РБК\n"
                  "• Investing.com\n"
                  "• ForkLog"
              )

              print(
                  "Sending Telegram test..."
              )

              try:
                  if send_telegram(
                      test_message
                  ):
                      print(
                          "Telegram test sent successfully."
                      )
                  else:
                      print(
                          "Telegram test failed."
                      )
              except Exception as e:
                  print(
                      f"Telegram test error: {e}"
                  )


          # ============================================================
          # MAIN MARKET MONITOR
          # ============================================================

          state = load_state()

          alerts_sent = 0

          print("")
          print("=" * 70)
          print("UNCLE GOO CRYPTO MONITOR")
          print("=" * 70)
          print("Bitget Spot")
          print("5m / 30m / 60m")
          print("=" * 70)

          for symbol in SYMBOLS:

              try:
                  market = calculate_market(
                      symbol
                  )

                  price = market["price"]
                  change_5 = market["change_5"]
                  change_30 = market["change_30"]
                  change_60 = market["change_60"]
                  volume_ratio = market[
                      "volume_ratio"
                  ]

                  print(
                      f"{symbol}: "
                      f"price={price:.10g} "
                      f"5m={change_5:+.2f}% "
                      f"30m={change_30:+.2f}% "
                      f"60m={change_60:+.2f}% "
                      f"volume={volume_ratio:.1f}x"
                  )

                  alerts = []

                  # --------------------------------------------------
                  # 5-MINUTE ALERTS
                  # --------------------------------------------------

                  if abs(change_5) >= EXTREME_5:
                      alerts.append(
                          (
                              "EXTREME",
                              change_5,
                              "5m",
                          )
                      )

                  elif abs(change_5) >= VERY_STRONG_5:
                      alerts.append(
                          (
                              "VERY STRONG",
                              change_5,
                              "5m",
                          )
                      )

                  elif abs(change_5) >= STRONG_5:
                      alerts.append(
                          (
                              "STRONG",
                              change_5,
                              "5m",
                          )
                      )

                  elif abs(change_5) >= SHARP_5:
                      alerts.append(
                          (
                              "SHARP",
                              change_5,
                              "5m",
                          )
                      )


                  # --------------------------------------------------
                  # 30-MINUTE ALERT
                  # --------------------------------------------------

                  if abs(change_30) >= STRONG_30:
                      alerts.append(
                          (
                              "STRONG",
                              change_30,
                              "30m",
                          )
                      )


                  # --------------------------------------------------
                  # 60-MINUTE ALERTS
                  # --------------------------------------------------

                  if abs(change_60) >= EXTREME_60:
                      alerts.append(
                          (
                              "EXTREME",
                              change_60,
                              "60m",
                          )
                      )

                  elif abs(change_60) >= SHARP_60:
                      alerts.append(
                          (
                              "SHARP",
                              change_60,
                              "60m",
                          )
                      )


                  # --------------------------------------------------
                  # ABNORMAL VOLUME
                  # --------------------------------------------------

                  if (
                      volume_ratio
                      >= ABNORMAL_VOLUME_RATIO
                      and
                      abs(change_60)
                      >= ABNORMAL_VOLUME_MOVE
                  ):
                      alerts.append(
                          (
                              "VOLUME",
                              change_60,
                              "60m",
                          )
                      )


                  # --------------------------------------------------
                  # SEND ALERTS
                  # --------------------------------------------------

                  for (
                      level,
                      change,
                      period,
                  ) in alerts:

                      direction = (
                          "UP"
                          if change > 0
                          else "DOWN"
                      )

                      fingerprint = (
                          f"{symbol}:"
                          f"{level}:"
                          f"{period}:"
                          f"{direction}"
                      )

                      if not should_send_alert(
                          state,
                          fingerprint,
                      ):
                          continue

                      if level == "EXTREME":
                          emoji = "🚨"
                          title = "EXTREME MOVE"

                      elif level == "VERY STRONG":
                          emoji = "🔴"
                          title = "VERY STRONG MOVE"

                      elif level == "STRONG":
                          emoji = "🔴"
                          title = "STRONG MOVE"

                      elif level == "SHARP":
                          emoji = "🟠"
                          title = "SHARP MOVE"

                      else:
                          emoji = "🟣"
                          title = "ABNORMAL VOLUME"


                      direction_text = (
                          "📈 Рост"
                          if change > 0
                          else "📉 Падение"
                      )

                      message = (
                          f"{emoji} {title}\n\n"
                          f"🪙 {symbol}\n"
                          f"💰 Price: {price:.10g}\n"
                          f"⏱ {period}: "
                          f"{change:+.2f}%\n"
                          f"{direction_text}\n"
                          f"📊 Volume: "
                          f"{volume_ratio:.1f}x\n\n"
                          f"Bitget Spot"
                      )

                      print(
                          "\nPRICE ALERT:\n"
                          + message
                      )

                      try:
                          success = send_telegram(
                              message
                          )

                          if success:
                              mark_alert_sent(
                                  state,
                                  fingerprint,
                              )

                              alerts_sent += 1

                      except Exception as e:
                          print(
                              f"Telegram price error: {e}"
                          )

              except Exception as e:
                  print(
                      f"ERROR {symbol}: {e}"
                  )


          # ============================================================
          # NEWS MONITOR
          # ============================================================

          try:
              news_sent = process_news(
                  state
              )
          except Exception as e:
              print(
                  f"NEWS PROCESS ERROR: {e}"
              )
              news_sent = 0


          # ============================================================
          # SAVE STATE
          # ============================================================

          save_state(state)

          try:
              save_state_to_github()
          except Exception as e:
              print(
                  f"GitHub state save error: {e}"
              )


          # ============================================================
          # SUMMARY
          # ============================================================

          print("")
          print("=" * 70)
          print(
              f"Price alerts sent: "
              f"{alerts_sent}"
          )
          print(
              f"News alerts sent: "
              f"{news_sent}"
          )

          if (
              alerts_sent == 0
              and news_sent == 0
          ):
              print("No alerts.")

          print("=" * 70)

          PY
