          # ============================================================
          # BITGET
          # ============================================================

          def get_candles(symbol):
              data = http_get_json(
                  BITGET_CANDLES_URL,
                  params={
                      'category': 'SPOT',
                      'symbol': symbol,
                      'interval': '1m',
                      'limit': 65,
                  },
                  timeout=20
              )

              rows = data.get(
                  'data',
                  []
              )

              candles = []

              for row in rows:
                  try:
                      timestamp = int(
                          row[0]
                      )

                      close = float(
                          row[4]
                      )

                      candles.append(
                          (
                              datetime.fromtimestamp(
                                  timestamp / 1000,
                                  tz=timezone.utc
                              ),
                              close
                          )
                      )

                  except Exception:
                      continue

              candles.sort(
                  key=lambda x: x[0]
              )

              return candles


          def get_ticker(symbol):
              data = http_get_json(
                  BITGET_TICKER_URL,
                  params={
                      'category': 'SPOT',
                      'symbol': symbol,
                  },
                  timeout=20
              )

              rows = data.get(
                  'data',
                  []
              )

              if not rows:
                  raise RuntimeError(
                      f'No ticker data for {symbol}'
                  )

              row = rows[0]

              value = row.get(
                  'lastPrice'
              )

              if value is None:
                  raise RuntimeError(
                      f'No lastPrice for {symbol}'
                  )

              return float(
                  value
              )


          def get_historical_close(
              candles,
              target_time
          ):
              completed = [
                  (
                      timestamp,
                      close
                  )
                  for timestamp, close
                  in candles
                  if timestamp <= target_time
              ]

              if not completed:
                  raise RuntimeError(
                      f'No completed 1m candle for '
                      f'{target_time.isoformat()}'
                  )

              return completed[-1]


          def calculate_market(symbol):
              price = get_ticker(
                  symbol
              )

              candles = get_candles(
                  symbol
              )

              now = datetime.now(
                  timezone.utc
              )

              periods = [
                  5,
                  15,
                  30,
                  45,
                  60,
              ]

              result = {
                  'symbol': symbol,
                  'price': price,
                  'market_time': now,
                  'historical_times': {},
              }

              for minutes in periods:
                  try:
                      target_time = (
                          now -
                          timedelta(
                              minutes=minutes
                          )
                      )

                      historical_time, historical_close = (
                          get_historical_close(
                              candles,
                              target_time
                          )
                      )

                      change = (
                          (
                              price -
                              historical_close
                          )
                          /
                          historical_close
                          *
                          100
                      )

                      result[
                          f'change_{minutes}'
                      ] = change

                      result[
                          'historical_times'
                      ][minutes] = (
                          historical_time
                      )

                  except Exception as e:
                      print(
                          f'{symbol}: no data for '
                          f'{minutes}m period ({e})'
                      )

                      result[f'change_{minutes}'] = None

              return result


          # ============================================================
          # PRICE SIGNALS (per-coin)
          # ============================================================

          def get_level(
              change,
              sharp,
              strong,
              very_strong,
              extreme
          ):
              absolute = abs(
                  change
              )

              if absolute >= extreme:
                  return 'EXTREME'

              if absolute >= very_strong:
                  return 'VERY STRONG'

              if absolute >= strong:
                  return 'STRONG'

              if absolute >= sharp:
                  return 'SHARP'

              return None


          def get_price_alerts(
              market
          ):
              alerts = []

              levels = [
                  (
                      '5m',
                      market['change_5'],
                      SHARP_5,
                      STRONG_5,
                      VERY_STRONG_5,
                      EXTREME_5,
                  ),
                  (
                      '15m',
                      market['change_15'],
                      SHARP_15,
                      STRONG_15,
                      VERY_STRONG_15,
                      EXTREME_15,
                  ),
                  (
                      '30m',
                      market['change_30'],
                      SHARP_30,
                      STRONG_30,
                      VERY_STRONG_30,
                      EXTREME_30,
                  ),
                  (
                      '45m',
                      market['change_45'],
                      SHARP_45,
                      STRONG_45,
                      VERY_STRONG_45,
                      EXTREME_45,
                  ),
                  (
                      '60m',
                      market['change_60'],
                      SHARP_60,
                      STRONG_60,
                      VERY_STRONG_60,
                      EXTREME_60,
                  ),
              ]

              for (
                  period,
                  change,
                  sharp,
                  strong,
                  very_strong,
                  extreme
              ) in levels:

                  if change is None:
                      continue

                  level = get_level(
                      change,
                      sharp,
                      strong,
                      very_strong,
                      extreme
                  )

                  if level:
                      alerts.append(
                          (
                              level,
                              change,
                              period
                          )
                      )

              return alerts


          # ============================================================
          # SIGNAL STRENGTH (per-coin)
          # ============================================================

          def calculate_signal_strength(
              price_alerts,
              news_article=None
          ):
              if not price_alerts:
                  return 'LOW'

              severity = {
                  'SHARP': 1,
                  'STRONG': 2,
                  'VERY STRONG': 3,
                  'EXTREME': 4,
              }

              strongest = max(
                  price_alerts,
                  key=lambda x: (
                      severity.get(
                          x[0],
                          0
                      ),
                      abs(x[1])
                  )
              )

              base_score = severity.get(
                  strongest[0],
                  0
              )

              if len(
                  price_alerts
              ) >= 2:
                  base_score += 1

              if news_article:
                  base_score += 1

              if base_score >= 7:
                  return 'EXTREME'

              if base_score >= 5:
                  return 'VERY HIGH'

              if base_score >= 4:
                  return 'HIGH'

              if base_score >= 3:
                  return 'MEDIUM'

              return 'LOW'


          # ============================================================
          # MARKET-WIDE BREADTH (variant 4: breadth + avg strength)
          # ============================================================

          def calculate_market_breadth(markets, minutes):
              """
              For a given period (minutes), look across all coins with
              valid data and compute:
                - how many coins moved down / up beyond the noise
                  threshold (breadth)
                - the average % change across all valid coins
                - the top movers in the dominant direction
              """

              key = f'change_{minutes}'

              valid = []

              for symbol, market in markets.items():
                  if market is None:
                      continue

                  change = market.get(key)

                  if change is None:
                      continue

                  valid.append((symbol, change))

              total = len(valid)

              if total == 0:
                  return None

              down_count = sum(
                  1 for _, c in valid
                  if c <= -MARKET_MOVING_THRESHOLD
              )

              up_count = sum(
                  1 for _, c in valid
                  if c >= MARKET_MOVING_THRESHOLD
              )

              avg_change = sum(c for _, c in valid) / total

              if down_count >= up_count:
                  direction = 'DOWN'
                  dominant_count = down_count
              else:
                  direction = 'UP'
                  dominant_count = up_count

              breadth_pct = dominant_count / total

              sorted_valid = sorted(
                  valid,
                  key=lambda x: x[1],
                  reverse=(direction == 'UP')
              )

              top_movers = sorted_valid[:MARKET_TOP_MOVERS_COUNT]

              return {
                  'period': minutes,
                  'total': total,
                  'dominant_count': dominant_count,
                  'breadth_pct': breadth_pct,
                  'avg_change': avg_change,
                  'direction': direction,
                  'top_movers': top_movers,
              }


          def get_market_level(avg_change, minutes):
              thresholds = MARKET_AVG_THRESHOLDS.get(minutes)

              if not thresholds:
                  return None

              sharp, strong, very_strong, extreme = thresholds

              return get_level(
                  avg_change,
                  sharp,
                  strong,
                  very_strong,
                  extreme
              )


          def get_market_breadth_alerts(markets):
              """
              Returns a list of market-wide alerts across all periods
              that satisfy BOTH the breadth requirement AND the average
              move threshold for that period.
              """

              alerts = []

              for minutes in (5, 15, 30, 45, 60):

                  breadth = calculate_market_breadth(
                      markets,
                      minutes
                  )

                  if breadth is None:
                      continue

                  if breadth['breadth_pct'] < MARKET_BREADTH_MIN:
                      continue

                  level = get_market_level(
                      breadth['avg_change'],
                      minutes
                  )

                  if not level:
                      continue

                  breadth['level'] = level

                  alerts.append(breadth)

              return alerts


          def format_market_alert(breadth, state):
              period = breadth['period']
              direction = breadth['direction']
              level = breadth['level']
              avg_change = breadth['avg_change']
              breadth_pct = breadth['breadth_pct']
              total = breadth['total']
              dominant_count = breadth['dominant_count']
              top_movers = breadth['top_movers']

              icon = '🔴' if direction == 'DOWN' else '🟢'

              label = (
                  'ВОЗМОЖНОЕ ПАДЕНИЕ РЫНКА'
                  if direction == 'DOWN'
                  else 'ВОЗМОЖНЫЙ РОСТ РЫНКА'
              )

              movers_lines = []

              for symbol, change in top_movers:
                  coin = symbol.replace('USDT', '')

                  movers_lines.append(
                      f'{coin} {change:+.2f}%'
                  )

              movers_text = ' | '.join(movers_lines)

              message = (
                  f'{icon} {label}\n\n'
                  f'⏱ Период: {period}m\n'
                  f'📊 {dominant_count} из {total} монет '
                  f'движутся в одну сторону '
                  f'({breadth_pct * 100:.0f}%)\n'
                  f'📉 Среднее изменение: {avg_change:+.2f}%\n'
                  f'🟠 Уровень: {level}\n\n'
                  f'Топ движений:\n{movers_text}\n\n'
                  'Bitget Spot · сводка по всем '
                  'отслеживаемым монетам'
              )

              return message


          def send_market_breadth_alerts(state, market_alerts):
              sent = 0

              # Only escalating levels matter most for a fast reaction;
              # send the single strongest alert per run to avoid
              # flooding with multiple period alerts at once.
              if not market_alerts:
                  return sent

              severity = {
                  'SHARP': 1,
                  'STRONG': 2,
                  'VERY STRONG': 3,
                  'EXTREME': 4,
              }

              strongest = max(
                  market_alerts,
                  key=lambda b: (
                      severity.get(b['level'], 0),
                      abs(b['avg_change'])
                  )
              )

              # Shorter cooldown for stronger levels so an escalating
              # downturn still gets a fresh alert sooner.
              cooldown_by_level = {
                  'SHARP': 60,
                  'STRONG': 30,
                  'VERY STRONG': 15,
                  'EXTREME': 10,
              }

              cooldown = cooldown_by_level.get(
                  strongest['level'],
                  ALERT_COOLDOWN_MINUTES
              )

              fingerprint = (
                  f'MARKET:{strongest["period"]}:'
                  f'{strongest["direction"]}:'
                  f'{strongest["level"]}'
              )

              if alert_already_sent(
                  state,
                  fingerprint,
                  cooldown_minutes=cooldown
              ):
                  return sent

              message = format_market_alert(
                  strongest,
                  state
              )

              print(
                  '\nMARKET BREADTH ALERT:\n'
                  + message
              )

              try:
                  success = send_telegram(message)

                  if success:
                      mark_alert_sent(state, fingerprint)
                      sent += 1

              except Exception as e:
                  print(
                      f'Telegram market alert error: {e}'
                  )

              return sent


