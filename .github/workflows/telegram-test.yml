name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]

          COINS = [
              "BTC","ETH","XRP","ETC","FIL","ETHFI","ONDO","TWT",
              "XLM","ARKM","GRAM","STRK","ARB","STX","RENDER","JUP",
              "PYTH","FET","PEPE","MANTA","ZK","HYPE"
          ]

          BASE = "https://api.bitget.com"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Uncle-Goo-Crypto-Monitor/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def get_candles(symbol):
              url = BASE + "/api/v3/market/candles?" + urllib.parse.urlencode({
                  "category": "SPOT",
                  "symbol": symbol,
                  "interval": "5m",
                  "limit": "13"
              })

              data = get_json(url)

              if data.get("code") != "00000":
                  return []

              return data.get("data", [])

          def get_chat_id():
              url = f"https://api.telegram.org/bot{TOKEN}/getUpdates"

              result = get_json(url)

              if not result.get("ok"):
                  return None

              updates = result.get("result", [])

              # Ищем последнее сообщение пользователя боту
              for update in reversed(updates):
                  message = update.get("message")

                  if message and message.get("chat"):
                      chat = message["chat"]

                      if chat.get("type") == "private":
                          return chat.get("id")

              return None

          def send_message(chat_id, text):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"

              body = urllib.parse.urlencode({
                  "chat_id": str(chat_id),
                  "text": text
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=20) as r:
                  result = json.loads(r.read().decode())

              if not result.get("ok"):
                  print("Telegram error:", result)

          alerts = []

          print("Starting crypto monitor...")

          for coin in COINS:

              symbol = coin + "USDT"

              try:
                  data = get_candles(symbol)

                  if len(data) < 13:
                      print(f"{symbol}: not enough data")
                      continue

                  # Bitget отдаёт новые свечи первыми
                  data = list(reversed(data))

                  old_60 = float(data[0][4])
                  old_30 = float(data[6][4])
                  current = float(data[-1][4])

                  change_60 = (current / old_60 - 1) * 100
                  change_30 = (current / old_30 - 1) * 100

                  volumes = [
                      float(x[5])
                      for x in data[:-1]
                  ]

                  current_volume = float(data[-1][5])

                  avg_volume = (
                      sum(volumes) / len(volumes)
                      if volumes else 0
                  )

                  volume_ratio = (
                      current_volume / avg_volume
                      if avg_volume > 0 else 0
                  )

                  print(
                      f"{symbol}: "
                      f"30m={change_30:+.2f}% "
                      f"60m={change_60:+.2f}% "
                      f"volume={volume_ratio:.1f}x"
                  )

                  level = None

                  if abs(change_60) >= 12:
                      level = "🚨 ЭКСТРЕМАЛЬНОЕ ДВИЖЕНИЕ"

                  elif abs(change_30) >= 8:
                      level = "🔴 СИЛЬНОЕ ДВИЖЕНИЕ"

                  elif abs(change_60) >= 5:
                      level = "🟠 РЕЗКОЕ ДВИЖЕНИЕ"

                  if level:

                      direction = (
                          "📈 РОСТ"
                          if change_60 > 0
                          else "📉 ПАДЕНИЕ"
                      )

                      alerts.append(
                          f"{level}\n"
                          f"{direction}: {coin}/USDT\n"
                          f"Цена: ${current:,.8f}\n"
                          f"30 мин: {change_30:+.2f}%\n"
                          f"60 мин: {change_60:+.2f}%\n"
                          f"Объём: {volume_ratio:.1f}x среднего"
                      )

                  elif (
                      volume_ratio >= 3
                      and abs(change_60) >= 3
                  ):

                      direction = (
                          "📈"
                          if change_60 > 0
                          else "📉"
                      )

                      alerts.append(
                          f"⚠️ АНОМАЛЬНЫЙ ОБЪЁМ\n"
                          f"{direction} {coin}/USDT\n"
                          f"Цена: ${current:,.8f}\n"
                          f"60 мин: {change_60:+.2f}%\n"
                          f"Объём: {volume_ratio:.1f}x среднего"
                      )

              except Exception as e:
                  print(f"{symbol}: ERROR: {e}")

          print("")
          print(f"Alerts found: {len(alerts)}")

          if alerts:

              chat_id = get_chat_id()

              if not chat_id:
                  print("ERROR: Telegram chat ID not found.")
                  print("Send /start to the bot and run the workflow again.")
                  raise SystemExit(1)

              now = datetime.now(timezone.utc).strftime(
                  "%Y-%m-%d %H:%M UTC"
              )

              message = (
                  "🚀 UNCLE GOO CRYPTO MONITOR\n\n"
                  + "\n\n".join(alerts)
                  + f"\n\n⏱ {now}"
              )

              send_message(chat_id, message)

              print("Telegram alert sent successfully.")

          else:
              print("No alerts. Telegram message not required.")

          PY
