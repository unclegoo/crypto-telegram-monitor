          # ============================================================
          # HTTP
          # ============================================================

          def http_get_json(
              url,
              params=None,
              timeout=20
          ):
              if params:
                  url += "?" + urllib.parse.urlencode(
                      params
                  )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Uncle-Goo-Crypto-Monitor/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:
                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          def http_get_text(
              url,
              timeout=20
          ):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 Uncle-Goo-Crypto-Monitor/1.0",
                      "Accept":
                          "application/rss+xml, application/xml, "
                          "text/html, text/xml, */*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:
                  return response.read()


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_api(
              method,
              payload=None
          ):
              if not TELEGRAM_BOT_TOKEN:
                  print(
                      "TELEGRAM_BOT_TOKEN is not configured."
                  )
                  return {}

              url = (
                  "https://api.telegram.org/"
                  f"bot{TELEGRAM_BOT_TOKEN}/{method}"
              )

              data = None

              if payload is not None:
                  data = urllib.parse.urlencode(
                      payload
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "User-Agent":
                          "Uncle-Goo-Crypto-Monitor/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          def get_chat_id():
              result = telegram_api(
                  "getUpdates"
              )

              updates = result.get(
                  "result",
                  []
              )

              if not updates:
                  return None

              for update in reversed(
                  updates
              ):
                  message = update.get(
                      "message"
                  )

                  if (
                      message
                      and message.get("chat")
                  ):
                      return message[
                          "chat"
                      ]["id"]

              return None


          def send_telegram(text):
              chat_id = get_chat_id()

              if chat_id is None:
                  print(
                      "Telegram chat ID not found."
                  )
                  print(
                      "Send /start to the bot first."
                  )
                  return False

              result = telegram_api(
                  "sendMessage",
                  {
                      "chat_id": chat_id,
                      "text": text,
                      "disable_web_page_preview":
                          False,
                  },
              )

              return result.get(
                  "ok",
                  False
              )


          # ============================================================
          # STATE
          # ============================================================

          def load_state():

              if not os.path.exists(
                  STATE_FILE
              ):
                  return {
                      "alerts": {},
                      "news": {},
                  }

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      raw = json.load(f)

                  if (
                      "alerts" not in raw
                      and
                      "news" not in raw
                  ):
                      return {
                          "alerts": raw,
                          "news": {},
                      }

                  raw.setdefault(
                      "alerts",
                      {}
                  )

                  raw.setdefault(
                      "news",
                      {}
                  )

                  return raw

              except Exception:

                  return {
                      "alerts": {},
                      "news": {},
                  }


          def save_state(state):

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )


          def save_state_to_github():

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE,
                  ],
                  check=True,
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet",
                  ]
              )

              if result.returncode == 0:
                  return

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update crypto monitor state",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                  ],
                  check=True,
              )


          # ============================================================
          # DEDUPLICATION
          # ============================================================

          def should_send_alert(
              state,
              fingerprint
          ):

              item = state[
                  "alerts"
              ].get(
                  fingerprint
              )

              if not item:
                  return True

              try:

                  sent_at = datetime.fromisoformat(
                      item["sent_at"]
                  )

                  now = datetime.now(
                      timezone.utc
                  )

                  age = (
                      now - sent_at
                  ).total_seconds() / 60

                  return (
                      age
                      >= ALERT_COOLDOWN_MINUTES
                  )

              except Exception:

                  return True


          def mark_alert_sent(
              state,
              fingerprint
          ):

              state[
                  "alerts"
              ][fingerprint] = {
                  "sent_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat()
              }


          # ============================================================
          # BITGET
          # ============================================================

          def get_ticker(symbol):

              data = http_get_json(
                  BITGET_TICKER_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                  },
              )

              if data.get(
                  "code"
              ) != "00000":

                  raise RuntimeError(
                      f"Bitget ticker error: {data}"
                  )

              rows = data.get(
                  "data",
                  []
              )

              if not rows:
                  raise RuntimeError(
                      f"No ticker data for {symbol}"
                  )

              last_price = rows[
                  0
              ].get(
                  "lastPrice"
              )

              if last_price is None:
                  raise RuntimeError(
                      f"No lastPrice for {symbol}"
                  )

              return float(
                  last_price
              )


          def get_candles(symbol):

              data = http_get_json(
                  BITGET_CANDLES_URL,
                  {
                      "category": "SPOT",
                      "symbol": symbol,
                      "interval": "5m",
                      "limit": 30,
                  },
              )

              if data.get(
                  "code"
              ) != "00000":

                  raise RuntimeError(
                      f"Bitget candle error: {data}"
                  )

              candles = data.get(
                  "data",
                  []
              )

              if len(candles) < 13:

                  raise RuntimeError(
                      f"Not enough candles for "
                      f"{symbol}: {len(candles)}"
                  )

              # IMPORTANT:
              # Sort by timestamp.
              # Do NOT blindly reverse.
              candles = sorted(
                  candles,
                  key=lambda c:
                      int(c[0])
              )

              closes = [
                  float(c[4])
                  for c in candles
              ]

              volumes = [
                  float(c[5])
                  for c in candles
              ]

              return (
                  closes,
                  volumes
              )


          def calculate_market(symbol):

              price_now = get_ticker(
                  symbol
              )

              closes, volumes = get_candles(
                  symbol
              )

              price_5 = closes[-2]
              price_30 = closes[-7]
              price_60 = closes[-13]

              change_5 = (
                  (
                      price_now /
                      price_5
                  ) - 1
              ) * 100

              change_30 = (
                  (
                      price_now /
                      price_30
                  ) - 1
              ) * 100

              change_60 = (
                  (
                      price_now /
                      price_60
                  ) - 1
              ) * 100

              current_volume = sum(
                  volumes[-6:]
              )

              previous_volume = sum(
                  volumes[-12:-6]
              )

              if previous_volume > 0:

                  volume_ratio = (
                      current_volume /
                      previous_volume
                  )

              else:

                  volume_ratio = 0

              return {
                  "price":
                      price_now,

                  "change_5":
                      change_5,

                  "change_30":
                      change_30,

                  "change_60":
                      change_60,

                  "volume_ratio":
                      volume_ratio,
              }


          # ============================================================
          # TEXT / DATE
          # ============================================================

          def clean_text(text):

              if not text:
                  return ""

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def parse_date(value):

              if not value:
                  return None

              value = value.strip()

              try:

                  dt = parsedate_to_datetime(
                      value
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  pass

              try:

                  value = value.replace(
                      "Z",
                      "+00:00"
                  )

                  dt = datetime.fromisoformat(
                      value
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:

                  return None


          # ============================================================
          # RSS PARSER
          # ============================================================

          def parse_feed(
              source_name,
              url
          ):

              raw = http_get_text(
                  url,
                  timeout=NEWS_TIMEOUT
              )

              root = ET.fromstring(
                  raw
              )

              articles = []

              # RSS
              for item in root.findall(
                  ".//item"
              ):

                  title = clean_text(
                      item.findtext(
                          "title"
                      )
                  )

                  link = clean_text(
                      item.findtext(
                          "link"
                      )
                  )

                  description = clean_text(
                      item.findtext(
                          "description"
                      )
                  )

                  pub_date = (
                      item.findtext(
                          "pubDate"
                      )
                      or
                      item.findtext(
                          "published"
                      )
                      or
                      item.findtext(
                          "updated"
                      )
                  )

                  dt = parse_date(
                      pub_date
                  )

                  if title:

                      articles.append(
                          {
                              "source":
                                  source_name,

                              "title":
                                  title,

                              "link":
                                  link,

                              "description":
                                  description,

                              "date":
                                  dt,
                          }
                      )

              # Atom
              if not articles:

                  ns = {
                      "atom":
                          "http://www.w3.org/2005/Atom"
                  }

                  for entry in root.findall(
                      ".//atom:entry",
                      ns
                  ):

                      title_node = entry.find(
                          "atom:title",
                          ns
                      )

                      title = clean_text(
                          title_node.text
                          if title_node
                          is not None
                          else ""
                      )

                      link = ""

                      link_node = entry.find(
                          "atom:link",
                          ns
                      )

                      if link_node is not None:

                          link = (
                              link_node.attrib.get(
                                  "href",
                                  ""
                              )
                          )

                      summary_node = entry.find(
                          "atom:summary",
                          ns
                      )

                      description = clean_text(
                          summary_node.text
                          if summary_node
                          is not None
                          else ""
                      )

                      published_node = entry.find(
                          "atom:published",
                          ns
                      )

                      updated_node = entry.find(
                          "atom:updated",
                          ns
                      )

                      date_value = ""

                      if published_node is not None:

                          date_value = (
                              published_node.text
                              or ""
                          )

                      elif updated_node is not None:

                          date_value = (
                              updated_node.text
                              or ""
                          )

                      dt = parse_date(
                          date_value
                      )

                      if title:

                          articles.append(
                              {
                                  "source":
                                      source_name,

                                  "title":
                                      title,

                                  "link":
                                      link,

                                  "description":
                                      description,

                                  "date":
                                      dt,
                              }
                          )

              return articles


          # ============================================================
          # CRYPTO.RU PARSER
          # ============================================================

          def parse_crypto_ru():

              raw = http_get_text(
                  CRYPTO_RU_NEWS_URL,
                  timeout=NEWS_TIMEOUT
              )

              html = raw.decode(
                  "utf-8",
                  errors="ignore"
              )

              articles = []

              # Extract news article links.
              # Crypto.ru uses /news/... URLs for
              # individual news articles.

              pattern = re.compile(
                  r'href=["\']'
                  r'(https://crypto\.ru/[^"\']+|/news/[^"\']+)'
                  r'["\'][^>]*>'
                  r'\s*(?:<[^>]+>\s*)*'
                  r'([^<]{10,300})'
                  r'\s*(?:<[^>]+>\s*)*'
                  r'</a>',
                  re.IGNORECASE
              )

              seen = set()

              for match in pattern.finditer(
                  html
              ):

                  link = match.group(
                      1
                  )

                  title = clean_text(
                      match.group(
                          2
                      )
                  )

                  if link.startswith(
                      "/"
                  ):

                      link = (
                          "https://crypto.ru"
                          + link
                      )

                  if (
                      "/news/"
                      not in link
                  ):
                      continue

                  if not title:
                      continue

                  key = (
                      link,
                      title
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  # Look around the article link
                  # for a visible date/time.
                  start = max(
                      0,
                      match.start() - 1500
                  )

                  context = html[
                      start:
                      match.end() + 500
                  ]

                  date_match = re.search(
                      r'(\d{1,2}\.\d{1,2}\.\d{4})'
                      r'(?:[^0-9]{0,100}'
                      r'(\d{1,2}:\d{2}))?',
                      context
                  )

                  dt = None

                  if date_match:

                      date_part = (
                          date_match.group(
                              1
                          )
                      )

                      time_part = (
                          date_match.group(
                              2
                          )
                          or
                          "00:00"
                      )

                      try:

                          naive = datetime.strptime(
                              date_part
                              + " "
                              + time_part,
                              "%d.%m.%Y %H:%M"
                          )

                          dt = naive.replace(
                              tzinfo=timezone.utc
                          )

                      except Exception:
                          dt = None

                  articles.append(
                      {
                          "source":
                              "Crypto.ru",

                          "title":
                              title,

                          "link":
                              link,

                          "description":
                              "",

                          "date":
                              dt,
                      }
                  )

                  if len(
                      articles
                  ) >= 50:
                      break

              return articles


          # ============================================================
          # NEWS MATCHING
          # ============================================================

          def article_coin_matches(
              article,
              symbol
          ):

              coin = symbol.replace(
                  "USDT",
                  ""
              )

              keywords = NEWS_KEYWORDS.get(
                  coin,
                  []
              )

              text = (
                  article.get(
                      "title",
                      ""
                  )
                  + " "
                  + article.get(
                      "description",
                      ""
                  )
              ).lower()

              for keyword in keywords:

                  keyword = keyword.lower()

                  if keyword in text:
                      return True

              return False


          def detect_news_signal(
              article
          ):

              text = (
                  article.get(
                      "title",
                      ""
                  )
                  + " "
                  + article.get(
                      "description",
                      ""
                  )
              ).lower()

              for (
                  signal_name,
                  keywords
              ) in NEWS_SIGNALS:

                  for keyword in keywords:

                      if (
                          keyword.lower()
                          in text
                      ):
                          return signal_name

              return None


          def news_fingerprint(
              article,
              symbol
          ):

              raw = (
                  symbol
                  + "|"
                  + article.get(
                      "source",
                      ""
                  )
                  + "|"
                  + article.get(
                      "title",
                      ""
                  )
              )

              return hashlib.sha256(
                  raw.encode(
                      "utf-8"
                  )
              ).hexdigest()


          # ============================================================
          # COLLECT NEWS CONTEXT
          # ============================================================

          def collect_news():

              now = datetime.now(
                  timezone.utc
              )

              cutoff = (
                  now -
                  timedelta(
                      hours=
                          NEWS_LOOKBACK_HOURS
                  )
              )

              all_articles = []

              # RSS sources
              for (
                  source_name,
                  feed_url
              ) in NEWS_FEEDS:

                  try:

                      articles = parse_feed(
                          source_name,
                          feed_url
                      )

                      print(
                          f"{source_name}: "
                          f"{len(articles)} articles"
                      )

                      all_articles.extend(
                          articles
                      )

                  except Exception as e:

                      print(
                          f"NEWS ERROR "
                          f"{source_name}: "
                          f"{e}"
                      )

              # Crypto.ru
              try:

                  articles = parse_crypto_ru()

                  print(
                      f"Crypto.ru: "
                      f"{len(articles)} articles"
                  )

                  all_articles.extend(
                      articles
                  )

              except Exception as e:

                  print(
                      f"NEWS ERROR "
                      f"Crypto.ru: {e}"
                  )


              # Newest first
              all_articles.sort(
                  key=lambda a: (
                      a.get("date")
                      or
                      datetime.min.replace(
                          tzinfo=timezone.utc
                      )
                  ),
                  reverse=True
              )


              # Keep only fresh articles.
              fresh = []

              for article in all_articles:

                  article_date = article.get(
                      "date"
                  )

                  # If a source doesn't expose a
                  # date reliably, don't use it
                  # for a time-sensitive combined
                  # signal.
                  if article_date is None:
                      continue

                  if article_date < cutoff:
                      continue

                  signal = detect_news_signal(
                      article
                  )

                  if not signal:
                      continue

                  article[
                      "signal"
                  ] = signal

                  fresh.append(
                      article
                  )


              # Map:
              # symbol -> relevant fresh news
              context = {}

              for symbol in SYMBOLS:

                  matches = []

                  for article in fresh:

                      if article_coin_matches(
                          article,
                          symbol
                      ):

                          matches.append(
                              article
                          )

                  context[
                      symbol
                  ] = matches

              print(
                  f"Fresh significant news: "
                  f"{len(fresh)}"
              )

              return context


          # ============================================================
          # NEWS STATE
          # ============================================================

          def news_already_sent(
              state,
              fingerprint
          ):

              return (
                  fingerprint
                  in state["news"]
              )


          def mark_news_sent(
              state,
              fingerprint
          ):

              state[
                  "news"
              ][fingerprint] = {
                  "sent_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat()
              }


          # ============================================================
          # FORMAT NEWS
          # ============================================================

          def format_news_line(
              article
          ):

              source = article.get(
                  "source",
                  "News"
              )

              title = article.get(
                  "title",
                  ""
              )

              link = article.get(
                  "link",
                  ""
              )

              signal = article.get(
                  "signal",
                  "📰 NEWS"
              )

              return (
                  f"{signal}\n\n"
                  f"📰 {title}\n\n"
                  f"Источник: {source}\n"
                  f"{link}"
              )


          # ============================================================
          # PRICE ALERT CLASSIFICATION
          # ============================================================

          def get_price_alerts(
              change_5,
              change_30,
              change_60
          ):

              alerts = []

              # 5m
              if (
                  abs(change_5)
                  >= EXTREME_5
              ):

                  alerts.append(
                      (
                          "EXTREME",
                          change_5,
                          "5m"
                      )
                  )

              elif (
                  abs(change_5)
                  >= VERY_STRONG_5
              ):

                  alerts.append(
                      (
                          "VERY STRONG",
                          change_5,
                          "5m"
                      )
                  )

              elif (
                  abs(change_5)
                  >= STRONG_5
              ):

                  alerts.append(
                      (
                          "STRONG",
                          change_5,
                          "5m"
                      )
                  )

              elif (
                  abs(change_5)
                  >= SHARP_5
              ):

                  alerts.append(
                      (
                          "SHARP",
                          change_5,
                          "5m"
                      )
                  )


              # 30m
              if (
                  abs(change_30)
                  >= STRONG_30
              ):

                  alerts.append(
                      (
                          "STRONG",
                          change_30,
                          "30m"
                      )
                  )


              # 60m
              if (
                  abs(change_60)
                  >= EXTREME_60
              ):

                  alerts.append(
                      (
                          "EXTREME",
                          change_60,
                          "60m"
                      )
                  )

              elif (
                  abs(change_60)
                  >= SHARP_60
              ):

                  alerts.append(
                      (
                          "SHARP",
                          change_60,
                          "60m"
                      )
                  )

              return alerts


          # ============================================================
          # SIGNAL MESSAGE
          # ============================================================

          def send_price_alert(
              state,
              symbol,
              market,
              level,
              change,
              period,
              news_article=None,
              combined=False,
              volume_signal=False
          ):

              direction = (
                  "UP"
                  if change > 0
                  else "DOWN"
              )

              fingerprint = (
                  f"{symbol}:"
                  f"{level}:"
                  f"{period}:"
                  f"{direction}:"
                  f"{'COMBINED' if combined else 'PRICE'}"
              )

              if not should_send_alert(
                  state,
                  fingerprint
              ):
                  return False


              price = market[
                  "price"
              ]

              volume_ratio = market[
                  "volume_ratio"
              ]


              # --------------------------------------------------------
              # Combined
              # --------------------------------------------------------

              if combined:

                  title = (
                      "🚨 COMBINED SIGNAL"
                  )

                  if (
                      volume_signal
                      and
                      news_article
                  ):

                      strength = (
                          "VERY HIGH"
                      )

                      reasons = (
                          "📈 Резкое движение цены\n"
                          "📊 Аномальный объём\n"
                          "📰 Найдена свежая "
                          "фундаментальная новость"
                      )

                  elif news_article:

                      strength = (
                          "HIGH"
                      )

                      reasons = (
                          "📈 Резкое движение цены\n"
                          "📰 Найдена свежая "
                          "фундаментальная новость"
                      )

                  else:

                      strength = (
                          "HIGH"
                      )

                      reasons = (
                          "📈 Резкое движение цены\n"
                          "📊 Аномальный объём"
                      )


                  message = (
                      f"{title}\n\n"

                      f"🪙 {symbol}\n"
                      f"💰 Price: "
                      f"{price:.10g}\n\n"

                      f"⏱ {period}: "
                      f"{change:+.2f}%\n"

                      f"📊 Volume: "
                      f"{volume_ratio:.1f}x\n\n"

                      f"🔥 Сила сигнала: "
                      f"{strength}\n\n"

                      f"{reasons}"
                  )


                  if news_article:

                      message += (
                          "\n\n"
                          "📰 Причина:\n"
                          + news_article.get(
                              "title",
                              ""
                          )
                          + "\n\n"
                          "Источник: "
                          + news_article.get(
                              "source",
                              "News"
                          )
                      )

                      link = news_article.get(
                          "link",
                          ""
                      )

                      if link:
                          message += (
                              "\n"
                              + link
                          )


                  message += (
                      "\n\n"
                      "Bitget Spot"
                  )

              # --------------------------------------------------------
              # Price + volume
              # --------------------------------------------------------

              elif volume_signal:

                  message = (
                      "🔴 PRICE + VOLUME\n\n"

                      f"🪙 {symbol}\n"
                      f"💰 Price: "
                      f"{price:.10g}\n\n"

                      f"⏱ {period}: "
                      f"{change:+.2f}%\n"

                      f"📊 Volume: "
                      f"{volume_ratio:.1f}x\n\n"

                      "Цена движется резко, "
                      "движение подтверждено "
                      "аномальным объёмом.\n\n"

                      "Bitget Spot"
                  )

              # --------------------------------------------------------
              # Normal price
              # --------------------------------------------------------

              else:

                  if level == "EXTREME":

                      emoji = "🚨"
                      title = "EXTREME MOVE"

                  elif level == "VERY STRONG":

                      emoji = "🔴"
                      title = (
                          "VERY STRONG MOVE"
                      )

                  elif level == "STRONG":

                      emoji = "🔴"
                      title = "STRONG MOVE"

                  else:

                      emoji = "🟠"
                      title = "SHARP MOVE"


                  direction_text = (
                      "📈 Рост"
                      if change > 0
                      else "📉 Падение"
                  )


                  message = (
                      f"{emoji} {title}\n\n"

                      f"🪙 {symbol}\n"
                      f"💰 Price: "
                      f"{price:.10g}\n"

                      f"⏱ {period}: "
                      f"{change:+.2f}%\n"

                      f"{direction_text}\n"

                      f"📊 Volume: "
                      f"{volume_ratio:.1f}x\n\n"

                      "Bitget Spot"
                  )


              print(
                  "\nPRICE ALERT:\n"
                  + message
              )


              try:

                  success = send_telegram(
                      message
                  )

                  if success:

                      mark_alert_sent(
                          state,
                          fingerprint
                      )

                      if news_article:

                          fp = news_fingerprint(
                              news_article,
                              symbol
                          )

                          mark_news_sent(
                              state,
                              fp
                          )

                      return True

              except Exception as e:

                  print(
                      f"Telegram price error: "
                      f"{e}"
                  )

              return False


          # ============================================================
          # SEND STANDALONE NEWS
          # ============================================================

          def send_standalone_news(
              state,
              news_context,
              combined_news
          ):

              news_sent = 0

              for symbol in SYMBOLS:

                  if (
                      news_sent
                      >= MAX_NEWS_ALERTS_PER_RUN
                  ):
                      break

                  for article in news_context.get(
                      symbol,
                      []
                  ):

                      if (
                          news_sent
                          >= MAX_NEWS_ALERTS_PER_RUN
                      ):
                          break

                      fp = news_fingerprint(
                          article,
                          symbol
                      )

                      if (
                          fp
                          in combined_news
                      ):
                          continue

                      if news_already_sent(
                          state,
                          fp
                      ):
                          continue

                      message = (
                          f"📰 FUNDAMENTAL EVENT\n\n"
                          f"🪙 {symbol}\n\n"
                          f"{format_news_line(article)}\n\n"
                          f"Цена пока не показывает "
                          f"достаточного движения.\n\n"
                          f"Bitget Spot"
                      )

                      print(
                          "\nNEWS ALERT:\n"
                          + message
                      )

                      try:

                          success = send_telegram(
                              message
                          )

                          if success:

                              mark_news_sent(
                                  state,
                                  fp
                              )

                              news_sent += 1

                      except Exception as e:

                          print(
                              f"Telegram news error: "
                              f"{e}"
                          )

              return news_sent


          # ============================================================
          # TEST TELEGRAM
          # ============================================================

          if TEST_TELEGRAM:

              test_message = (
                  "🚀 Uncle Goo Crypto Monitor\n\n"

                  "Тестовое сообщение работает!\n\n"

                  "Мониторинг:\n"
