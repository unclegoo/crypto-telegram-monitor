name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message"
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [check_prices]

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          python3 << 'PY'
          import os
          import json
          import re
          import subprocess
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import hashlib
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          TELEGRAM_BOT_TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          TELEGRAM_CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          TEST_TELEGRAM = os.environ.get('TEST_TELEGRAM', '').lower() == 'true'

          STATE_FILE = '.crypto_monitor_state.json'

          BITGET_CANDLES_URL = (
              'https://api.bitget.com/api/v3/market/candles'
