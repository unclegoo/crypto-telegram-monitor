          # CONFIG
          # ============================================================

          TELEGRAM_BOT_TOKEN = os.environ.get(
              "TELEGRAM_BOT_TOKEN",
              ""
          )

          TEST_TELEGRAM = (
              os.environ.get(
                  "TEST_TELEGRAM",
                  ""
              ).lower() == "true"
          )

          STATE_FILE = ".crypto_monitor_state.json"

