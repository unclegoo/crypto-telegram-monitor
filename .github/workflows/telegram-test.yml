                  )


          # ============================================================
          # MAIN
          # ============================================================

          state = load_state()


          # ------------------------------------------------------------
          # FIRST: collect news
          # ------------------------------------------------------------

          news_context = collect_news()


          alerts_sent = 0
          combined_news = set()


          print("")
          print("=" * 75)
          print(
              "UNCLE GOO CRYPTO MONITOR"
          )
          print("=" * 75)
          print(
              "Bitget Spot"
          )
          print(
              "5m / 30m / 60m"
          )
          print(
              "Price + Volume + News"
          )
          print("=" * 75)


          # ============================================================
          # MARKET LOOP
          # ============================================================

          for symbol in SYMBOLS:

              try:

                  market = calculate_market(
                      symbol
                  )

                  price = market[
                      "price"
                  ]

                  change_5 = market[
                      "change_5"
                  ]

                  change_30 = market[
                      "change_30"
                  ]

                  change_60 = market[
                      "change_60"
                  ]

                  volume_ratio = market[
                      "volume_ratio"
                  ]


                  print(
                      f"{symbol}: "
                      f"price={price:.10g} "
                      f"5m={change_5:+.2f}% "
                      f"30m={change_30:+.2f}% "
                      f"60m={change_60:+.2f}% "
                      f"volume={volume_ratio:.1f}x"
                  )


                  price_alerts = get_price_alerts(
                      change_5,
                      change_30,
                      change_60
                  )


                  relevant_news = (
                      news_context.get(
                          symbol,
                          []
                      )
                  )


                  # ----------------------------------------------------
                  # Select most important price alert
                  # ----------------------------------------------------

                  primary_alert = None

                  if price_alerts:

                      severity = {
                          "SHARP": 1,
                          "STRONG": 2,
                          "VERY STRONG": 3,
                          "EXTREME": 4,
                      }

                      primary_alert = max(
                          price_alerts,
                          key=lambda x:
                              (
                                  severity.get(
                                      x[0],
                                      0
                                  ),
                                  abs(x[1])
                              )
                      )


                  # ----------------------------------------------------
                  # Volume confirmation
                  # ----------------------------------------------------

                  volume_signal = (
                      volume_ratio
                      >= ABNORMAL_VOLUME_RATIO
                      and
                      (
                          abs(change_5)
                          >= ABNORMAL_VOLUME_MOVE
                          or
                          abs(change_60)
                          >= ABNORMAL_VOLUME_MOVE
                      )
                  )


                  # ----------------------------------------------------
                  # Fresh news
                  # ----------------------------------------------------

                  fresh_news = (
                      relevant_news[0]
                      if relevant_news
                      else None
                  )


                  # ----------------------------------------------------
                  # COMBINED SIGNAL
                  # ----------------------------------------------------

                  if primary_alert:

                      level, change, period = (
                          primary_alert
                      )


                      if (
                          fresh_news
                          and
                          volume_signal
                      ):

                          sent = send_price_alert(
                              state,
                              symbol,
                              market,
                              level,
                              change,
                              period,
                              news_article=
                                  fresh_news,
                              combined=True,
                              volume_signal=True
                          )

                          if sent:

                              alerts_sent += 1

                              combined_news.add(
                                  news_fingerprint(
                                      fresh_news,
                                      symbol
                                  )
                              )


                      elif fresh_news:

                          sent = send_price_alert(
                              state,
                              symbol,
                              market,
                              level,
                              change,
                              period,
                              news_article=
                                  fresh_news,
                              combined=True,
                              volume_signal=False
                          )

                          if sent:

                              alerts_sent += 1

                              combined_news.add(
                                  news_fingerprint(
                                      fresh_news,
                                      symbol
                                  )
                              )


                      elif volume_signal:

                          sent = send_price_alert(
                              state,
                              symbol,
                              market,
                              level,
                              change,
                              period,
                              combined=True,
                              volume_signal=True
                          )

                          if sent:

                              alerts_sent += 1


                      else:

                          sent = send_price_alert(
                              state,
                              symbol,
                              market,
                              level,
                              change,
                              period
                          )

                          if sent:

                              alerts_sent += 1


                  # ----------------------------------------------------
                  # Volume anomaly without price alert
                  # ----------------------------------------------------

                  elif (
                      volume_ratio
                      >= ABNORMAL_VOLUME_RATIO
                      and
                      abs(change_60)
                      >= ABNORMAL_VOLUME_MOVE
                  ):

                      fingerprint = (
                          f"{symbol}:"
                          f"VOLUME:"
                          f"60m:"
                          f"{'UP' if change_60 > 0 else 'DOWN'}"
                      )

                      if should_send_alert(
                          state,
                          fingerprint
                      ):

                          message = (
                              "🟣 ABNORMAL VOLUME\n\n"

                              f"🪙 {symbol}\n"
                              f"💰 Price: "
                              f"{price:.10g}\n\n"

                              f"⏱ 60m: "
                              f"{change_60:+.2f}%\n"

                              f"📊 Volume: "
                              f"{volume_ratio:.1f}x\n\n"

                              "Объём значительно выше "
                              "обычного.\n\n"

                              "Bitget Spot"
                          )

                          print(
                              "\nVOLUME ALERT:\n"
                              + message
                          )

                          try:

                              success = send_telegram(
                                  message
                              )

                              if success:

                                  mark_alert_sent(
                                      state,
                                      fingerprint
                                  )

                                  alerts_sent += 1

                          except Exception as e:

                              print(
                                  f"Telegram volume error: "
                                  f"{e}"
                              )


              except Exception as e:

                  print(
                      f"ERROR {symbol}: {e}"
                  )


          # ============================================================
          # STANDALONE FUNDAMENTAL NEWS
          # ============================================================

          try:

              news_sent = (
                  send_standalone_news(
                      state,
                      news_context,
                      combined_news
                  )
              )

          except Exception as e:

              print(
                  f"NEWS PROCESS ERROR: {e}"
              )

              news_sent = 0


          # ============================================================
          # SAVE
          # ============================================================

          save_state(
              state
          )


          try:

              save_state_to_github()

          except Exception as e:

              print(
                  f"GitHub state save error: "
                  f"{e}"
              )


          # ============================================================
          # SUMMARY
          # ============================================================

          print("")
          print("=" * 75)

          print(
              f"Price/combined alerts sent: "
              f"{alerts_sent}"
          )

          print(
              f"Standalone news alerts sent: "
              f"{news_sent}"
          )

          if (
              alerts_sent == 0
              and
              news_sent == 0
          ):

              print(
                  "No alerts."
              )

          print("=" * 75)

