name: Uncle Goo Crypto Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send Telegram test message"
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [check_prices]

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Crypto monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          python3 << 'PY'
          import os
          import json
          import re
          import time
          import random
          import subprocess
          import hashlib
          import urllib.request
          import urllib.parse
          import urllib.error
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          TELEGRAM_BOT_TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          TELEGRAM_CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          TEST_TELEGRAM = os.environ.get('TEST_TELEGRAM', '').lower() == 'true'

          STATE_FILE = '.crypto_monitor_state.json'

          BITGET_CANDLES_URL = 'https://api.bitget.com/api/v3/market/candles'
          BITGET_TICKER_URL = 'https://api.bitget.com/api/v3/market/tickers'

          NEWS_FEEDS = [
              ('РБК', 'https://rssexport.rbc.ru/rbcnews/news/30/full.rss'),
              ('Investing.com', 'https://ru.investing.com/rss/news_301.rss'),
              ('ForkLog', 'https://forklog.com/feed'),
          ]

          CRYPTO_RU_NEWS_URL = 'https://crypto.ru/novosti/'

          NEWS_LOOKBACK_HOURS = 2
          MAX_NEWS_ALERTS_PER_RUN = 3
          NEWS_TIMEOUT = 20
          ALERT_COOLDOWN_MINUTES = 60

          # Меньше потоков + пауза между запросами = нет ошибок 429 от Bitget
          MAX_WORKERS = 3
          REQUEST_DELAY = 0.15

          # ============================================================
          # PRICE ALERT LEVELS (per-coin)
          # period_minutes: (SHARP, STRONG, VERY_STRONG, EXTREME) в %
          # ============================================================

          PRICE_LEVELS = {
              5:    (3.0, 5.0, 8.0, 10.0),
              15:   (4.0, 6.0, 10.0, 14.0),
              30:   (5.0, 8.0, 12.0, 16.0),
              45:   (5.0, 8.0, 12.0, 18.0),
              60:   (5.0, 8.0, 12.0, 20.0),
              240:  (6.0, 10.0, 15.0, 22.0),
              1440: (10.0, 18.0, 28.0, 40.0),
          }

          SHORT_PERIODS = (5, 15, 30, 45, 60)
          LONG_PERIODS = (240, 1440)
          ALL_PERIODS = SHORT_PERIODS + LONG_PERIODS

          PERIOD_LABELS = {
              5: '5m', 15: '15m', 30: '30m', 45: '45m',
              60: '60m', 240: '4h', 1440: '24h',
          }

          # Кулдаун (минуты) для длинных периодов, чтобы не спамить
          COOLDOWN_BY_LABEL = {'4h': 240, '24h': 480}

          SEVERITY = {'SHARP': 1, 'STRONG': 2, 'VERY STRONG': 3, 'EXTREME': 4}

          # ============================================================
          # MARKET-WIDE BREADTH SETTINGS
          # ============================================================

          MARKET_BREADTH_MIN = 0.55
          MARKET_MOVING_THRESHOLD = 0.3

          MARKET_AVG_THRESHOLDS = {
              5:  (1.0, 1.8, 3.0, 4.5),
              15: (1.5, 2.5, 4.0, 6.0),
              30: (2.0, 3.5, 5.5, 8.0),
              45: (2.5, 4.0, 6.5, 9.5),
              60: (3.0, 4.5, 7.5, 11.0),
          }

          MARKET_TOP_MOVERS_COUNT = 5

          # ============================================================
          # COINS
          # ============================================================

          SYMBOLS = [
              'BTCUSDT', 'ETHUSDT', 'XRPUSDT', 'ETCUSDT', 'FILUSDT',
              'ETHFIUSDT', 'TWTUSDT', 'XLMUSDT', 'ARKMUSDT', 'GRAMUSDT',
              'STRKUSDT', 'ARBUSDT', 'STXUSDT', 'RENDERUSDT', 'JUPUSDT',
              'PYTHUSDT', 'FETUSDT', 'PEPEUSDT', 'MANTAUSDT', 'ZKUSDT',
              'HYPEUSDT',
          ]

          # ============================================================
          # NEWS KEYWORDS
          # ============================================================

          NEWS_KEYWORDS = {
              'BTC': ['bitcoin', 'btc', 'биткоин', 'биткойн'],
              'ETH': ['ethereum', 'ether', 'eth', 'эфириум', 'эфир'],
              'XRP': ['xrp', 'ripple', 'рипл'],
              'ETC': ['ethereum classic', 'etc'],
              'FIL': ['filecoin', 'file coin', 'fil'],
              'ETHFI': ['ether.fi', 'etherfi', 'ethfi'],
              'TWT': ['trust wallet', 'trustwallet', 'twt'],
              'XLM': ['stellar', 'xlm', 'стеллар'],
              'ARKM': ['arkham', 'arkm'],
              'GRAM': ['gram token', 'gram cryptocurrency', 'gram crypto', 'gram'],
              'STRK': ['starknet', 'strk'],
              'ARB': ['arbitrum', 'арбітрум', 'arb'],
              'STX': ['stacks', 'stx'],
              'RENDER': ['render network', 'render token', 'render'],
              'JUP': ['jupiter exchange', 'jupiter crypto', 'jupiter'],
              'PYTH': ['pyth network', 'pyth'],
              'FET': [
                  'fetch.ai', 'fetch ai',
                  'artificial superintelligence alliance', 'asi', 'fet',
              ],
              'PEPE': ['pepe coin', 'pepe token', 'pepe crypto', 'pepe'],
              'MANTA': ['manta network', 'manta'],
              'ZK': ['zksync', 'zk sync', 'zk'],
              'HYPE': ['hyperliquid', 'hype'],
          }

          # ============================================================
          # NEWS SIGNAL TYPES
          # ============================================================

          NEWS_SIGNALS = [
              (
                  '🚨 SECURITY',
                  [
                      'hack', 'hacked', 'exploit', 'exploited',
                      'vulnerability', 'breach', 'stolen', 'stole',
                      'attack', 'attacked', 'drained', 'compromised',
                      'security flaw', 'funds stolen', 'network halted',
                      'взлом', 'взломали', 'эксплойт', 'уязвимость',
                      'украдены', 'атак', 'атака', 'скомпрометирован',
                      'украл', 'краж',
                  ],
              ),
              (
                  '⚖️ REGULATION',
                  [
                      'sec', 'cftc', 'regulator', 'regulation',
                      'regulatory', 'lawsuit', 'court', 'legal', 'ban',
                      'banned', 'approval', 'etf', 'регулятор',
                      'регулирован', 'суд', 'иск', 'запрет', 'разрешение',
                      'одобрение',
                  ],
              ),
              (
                  '🏦 INSTITUTIONAL',
                  [
                      'institutional', 'institution', 'asset manager',
                      'etf', 'treasury', 'fund', 'институцион',
                      'инвестфонд', 'фонд',
                  ],
              ),
              (
                  '💰 FUNDING / INVESTMENT',
                  [
                      'funding', 'investment', 'investor', 'raises',
                      'raised', 'financing', 'capital', 'финансирован',
                      'инвестици', 'инвестор', 'раунд', 'капитал',
                  ],
              ),
              (
                  '🤝 PARTNERSHIP',
                  [
                      'partnership', 'partner', 'partners', 'integration',
                      'collaboration', 'партнер', 'партнёр', 'интеграци',
                      'сотрудничеств',
                  ],
              ),
              (
                  '🚀 NETWORK UPDATE',
                  [
                      'upgrade', 'hard fork', 'mainnet', 'testnet',
                      'launch', 'released', 'release', 'обновлен',
                      'обновление', 'хардфорк', 'мейннет', 'тестнет',
                      'запуск', 'релиз',
                  ],
              ),
          ]

          # ============================================================
          # HTTP (с повтором при 429 / 5xx)
          # ============================================================

          def http_get_json(url, params=None, timeout=20, retries=4):
              if params:
                  url += '?' + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'Uncle-Goo-Crypto-Monitor/1.0'},
              )

              for attempt in range(retries + 1):
                  try:
                      time.sleep(REQUEST_DELAY)
                      with urllib.request.urlopen(
                          request, timeout=timeout
                      ) as response:
                          return json.loads(response.read().decode('utf-8'))

                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and attempt < retries:
                          time.sleep(1.5 * (attempt + 1) + random.random())
                          continue
                      raise

                  except (urllib.error.URLError, TimeoutError):
                      if attempt < retries:
                          time.sleep(1 + random.random())
                          continue
                      raise


          def http_get_text(url, timeout=20):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0 Uncle-Goo-Crypto-Monitor/1.0',
                      'Accept': (
                          'application/rss+xml, application/xml, '
                          'text/html, text/xml, */*'
                      ),
                  },
              )

              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_api(method, payload=None):
              if not TELEGRAM_BOT_TOKEN:
                  print('TELEGRAM_BOT_TOKEN is not configured.')
                  return {}

              url = f'https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/{method}'

              data = None

              if payload is not None:
                  data = urllib.parse.urlencode(payload).encode('utf-8')

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={'User-Agent': 'Uncle-Goo-Crypto-Monitor/1.0'},
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))


          def get_chat_id_via_updates():
              result = telegram_api('getUpdates')
              updates = result.get('result', [])

              for update in reversed(updates):
                  message = update.get('message')

                  if message and message.get('chat'):
                      return message['chat']['id']

              return None


          def resolve_chat_id():
              if TELEGRAM_CHAT_ID:
                  return TELEGRAM_CHAT_ID

              chat_id = get_chat_id_via_updates()

              if chat_id is None:
                  print('Telegram chat ID not found.')
                  print(
                      'Set TELEGRAM_CHAT_ID secret, '
                      'or send /start to the bot first.'
                  )

              return chat_id


          def send_telegram(text):
              chat_id = resolve_chat_id()

              if chat_id is None:
                  return False

              result = telegram_api(
                  'sendMessage',
                  {
                      'chat_id': chat_id,
                      'text': text,
                      'disable_web_page_preview': False,
                  },
              )

              return result.get('ok', False)


          # ============================================================
          # STATE
          # ============================================================

          def load_state():
              empty = {'sent_alerts': {}, 'sent_news': {}}

              if not os.path.exists(STATE_FILE):
                  return empty

              try:
                  with open(STATE_FILE, 'r', encoding='utf-8') as f:
                      state = json.load(f)

                  if not isinstance(state, dict):
                      state = {}

                  state.setdefault('sent_alerts', {})
                  state.setdefault('sent_news', {})

                  return state

              except Exception as e:
                  print(f'State load error: {e}')
                  return empty


          def save_state(state):
              try:
                  with open(STATE_FILE, 'w', encoding='utf-8') as f:
                      json.dump(state, f, ensure_ascii=False, indent=2)

              except Exception as e:
                  print(f'State save error: {e}')


          def prune_dates(items, cutoff):
              cleaned = {}

              for key, value in items.items():
                  try:
                      if datetime.fromisoformat(value) >= cutoff:
                          cleaned[key] = value
                  except Exception:
                      pass

              return cleaned


          def cleanup_state(state):
              cutoff = datetime.now(timezone.utc) - timedelta(hours=24)

              state['sent_alerts'] = prune_dates(
                  state.get('sent_alerts', {}), cutoff
              )
              state['sent_news'] = prune_dates(
                  state.get('sent_news', {}), cutoff
              )


          def alert_already_sent(state, fingerprint, cooldown_minutes=None):
              cleanup_state(state)

              value = state.get('sent_alerts', {}).get(fingerprint)

              if not value:
                  return False

              cooldown = (
                  cooldown_minutes
                  if cooldown_minutes is not None
                  else ALERT_COOLDOWN_MINUTES
              )

              try:
                  sent_at = datetime.fromisoformat(value)
                  age = datetime.now(timezone.utc) - sent_at
                  return age.total_seconds() < cooldown * 60

              except Exception:
                  return False


          def mark_alert_sent(state, fingerprint):
              state.setdefault('sent_alerts', {})[fingerprint] = (
                  datetime.now(timezone.utc).isoformat()
              )


          def news_already_sent(state, fingerprint):
              cleanup_state(state)
              return fingerprint in state.get('sent_news', {})


          def mark_news_sent(state, fingerprint):
              state.setdefault('sent_news', {})[fingerprint] = (
                  datetime.now(timezone.utc).isoformat()
              )


          # ============================================================
          # GITHUB STATE SAVE
          # ============================================================

          def git(*args):
              return subprocess.run(['git', *args], check=False)


          def save_state_to_github():
              git('config', 'user.name', 'github-actions[bot]')
              git(
                  'config', 'user.email',
                  '41898282+github-actions[bot]@users.noreply.github.com'
              )
              git('add', STATE_FILE)

              if git('diff', '--cached', '--quiet').returncode == 0:
                  print('No state changes to commit.')
                  return

              git('commit', '-m', 'Update crypto monitor state')
              git('pull', '--rebase')
              git('push')


          # ============================================================
          # BITGET
          # ============================================================

          def get_candles(symbol, interval, limit):
              """Возвращает список (время, open, close), от старых к новым."""

              data = http_get_json(
                  BITGET_CANDLES_URL,
                  params={
                      'category': 'SPOT',
                      'symbol': symbol,
                      'interval': interval,
                      'limit': limit,
                  },
                  timeout=20
              )

              candles = []

              for row in data.get('data', []):
                  try:
                      candles.append(
                          (
                              datetime.fromtimestamp(
                                  int(row[0]) / 1000, tz=timezone.utc
                              ),
                              float(row[1]),
                              float(row[4]),
                          )
                      )
                  except Exception:
                      continue

              candles.sort(key=lambda x: x[0])

              return candles


          def get_ticker(symbol):
              data = http_get_json(
                  BITGET_TICKER_URL,
                  params={'category': 'SPOT', 'symbol': symbol},
                  timeout=20
              )

              rows = data.get('data', [])

              if not rows:
                  raise RuntimeError(f'No ticker data for {symbol}')

              value = rows[0].get('lastPrice')

              if value is None:
                  raise RuntimeError(f'No lastPrice for {symbol}')

              return float(value)


          def calculate_market(symbol):
              price = get_ticker(symbol)
              candles = get_candles(symbol, '1m', 65)

              # Длинные периоды: если запрос упал, короткие всё равно работают
              try:
                  long_candles = get_candles(symbol, '15m', 100)
              except Exception as e:
                  print(f'{symbol}: long candles error ({e})')
                  long_candles = []

              now = datetime.now(timezone.utc)

              result = {
                  'symbol': symbol,
                  'price': price,
                  'market_time': now,
              }

              for minutes in ALL_PERIODS:
                  try:
                      is_short = minutes in SHORT_PERIODS
                      source = candles if is_short else long_candles
                      target = now - timedelta(minutes=minutes)

                      past = [c for c in source if c[0] <= target]

                      if not past:
                          raise RuntimeError('no candle for target time')

                      _, candle_open, candle_close = past[-1]

                      base = candle_close if is_short else candle_open

                      result[f'change_{minutes}'] = (
                          (price - base) / base * 100
                      )

                  except Exception as e:
                      print(
                          f'{symbol}: no data for '
                          f'{PERIOD_LABELS[minutes]} period ({e})'
                      )
                      result[f'change_{minutes}'] = None

              return result


          # ============================================================
          # PRICE SIGNALS (per-coin)
          # ============================================================

          def get_level(change, sharp, strong, very_strong, extreme):
              absolute = abs(change)

              if absolute >= extreme:
                  return 'EXTREME'

              if absolute >= very_strong:
                  return 'VERY STRONG'

              if absolute >= strong:
                  return 'STRONG'

              if absolute >= sharp:
                  return 'SHARP'

              return None


          def get_price_alerts(market):
              alerts = []

              for minutes in ALL_PERIODS:
                  change = market.get(f'change_{minutes}')

                  if change is None:
                      continue

                  level = get_level(change, *PRICE_LEVELS[minutes])

                  if level:
                      alerts.append((level, change, PERIOD_LABELS[minutes]))

              return alerts


          def calculate_signal_strength(price_alerts, news_article=None):
              if not price_alerts:
                  return 'LOW'

              strongest = max(
                  price_alerts,
                  key=lambda x: (SEVERITY.get(x[0], 0), abs(x[1]))
              )

              base_score = SEVERITY.get(strongest[0], 0)

              if len(price_alerts) >= 2:
                  base_score += 1

              if news_article:
                  base_score += 1

              if base_score >= 7:
                  return 'EXTREME'

              if base_score >= 5:
                  return 'VERY HIGH'

              if base_score >= 4:
                  return 'HIGH'

              if base_score >= 3:
                  return 'MEDIUM'

              return 'LOW'


          # ============================================================
          # MARKET-WIDE BREADTH
          # ============================================================

          def calculate_market_breadth(markets, minutes):
              key = f'change_{minutes}'

              valid = []

              for symbol, market in markets.items():
                  if market is None:
                      continue

                  change = market.get(key)

                  if change is None:
                      continue

                  valid.append((symbol, change))

              total = len(valid)

              if total == 0:
                  return None

              down_count = sum(
                  1 for _, c in valid if c <= -MARKET_MOVING_THRESHOLD
              )

              up_count = sum(
                  1 for _, c in valid if c >= MARKET_MOVING_THRESHOLD
              )

              avg_change = sum(c for _, c in valid) / total

              if down_count >= up_count:
                  direction = 'DOWN'
                  dominant_count = down_count
              else:
                  direction = 'UP'
                  dominant_count = up_count

              breadth_pct = dominant_count / total

              sorted_valid = sorted(
                  valid,
                  key=lambda x: x[1],
                  reverse=(direction == 'UP')
              )

              return {
                  'period': minutes,
                  'total': total,
                  'dominant_count': dominant_count,
                  'breadth_pct': breadth_pct,
                  'avg_change': avg_change,
                  'direction': direction,
                  'top_movers': sorted_valid[:MARKET_TOP_MOVERS_COUNT],
              }


          def get_market_level(avg_change, minutes):
              thresholds = MARKET_AVG_THRESHOLDS.get(minutes)

              if not thresholds:
                  return None

              return get_level(avg_change, *thresholds)


          def get_market_breadth_alerts(markets):
              alerts = []

              for minutes in SHORT_PERIODS:
                  breadth = calculate_market_breadth(markets, minutes)

                  if breadth is None:
                      continue

                  if breadth['breadth_pct'] < MARKET_BREADTH_MIN:
                      continue

                  level = get_market_level(breadth['avg_change'], minutes)

                  if not level:
                      continue

                  breadth['level'] = level
                  alerts.append(breadth)

              return alerts


          def format_market_alert(breadth):
              direction = breadth['direction']

              icon = '🔴' if direction == 'DOWN' else '🟢'

              label = (
                  'ВОЗМОЖНОЕ ПАДЕНИЕ РЫНКА'
                  if direction == 'DOWN'
                  else 'ВОЗМОЖНЫЙ РОСТ РЫНКА'
              )

              movers_text = ' | '.join(
                  f"{symbol.replace('USDT', '')} {change:+.2f}%"
                  for symbol, change in breadth['top_movers']
              )

              return (
                  f'{icon} {label}\n\n'
                  f"⏱ Период: {breadth['period']}m\n"
                  f"📊 {breadth['dominant_count']} из {breadth['total']} "
                  f'монет движутся в одну сторону '
                  f"({breadth['breadth_pct'] * 100:.0f}%)\n"
                  f"📉 Среднее изменение: {breadth['avg_change']:+.2f}%\n"
                  f"🟠 Уровень: {breadth['level']}\n\n"
                  f'Топ движений:\n{movers_text}\n\n'
                  'Bitget Spot · сводка по всем отслеживаемым монетам'
              )


          def send_market_breadth_alerts(state, market_alerts):
              if not market_alerts:
                  return 0

              strongest = max(
                  market_alerts,
                  key=lambda b: (
                      SEVERITY.get(b['level'], 0),
                      abs(b['avg_change'])
                  )
              )

              cooldown_by_level = {
                  'SHARP': 60,
                  'STRONG': 30,
                  'VERY STRONG': 15,
                  'EXTREME': 10,
              }

              cooldown = cooldown_by_level.get(
                  strongest['level'], ALERT_COOLDOWN_MINUTES
              )

              fingerprint = (
                  f"MARKET:{strongest['period']}:"
                  f"{strongest['direction']}:{strongest['level']}"
              )

              if alert_already_sent(
                  state, fingerprint, cooldown_minutes=cooldown
              ):
                  return 0

              message = format_market_alert(strongest)

              print('\nMARKET BREADTH ALERT:\n' + message)

              try:
                  if send_telegram(message):
                      mark_alert_sent(state, fingerprint)
                      return 1

              except Exception as e:
                  print(f'Telegram market alert error: {e}')

              return 0


          # ============================================================
          # NEWS HELPERS
          # ============================================================

          def clean_text(text):
              if not text:
                  return ''

              text = re.sub(r'<[^>]+>', ' ', text)
              text = re.sub(r'\s+', ' ', text)

              return text.strip()


          def parse_news_date(value):
              if not value:
                  return None

              value = value.strip()

              try:
                  dt = parsedate_to_datetime(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  pass

              formats = [
                  '%Y-%m-%dT%H:%M:%S%z',
                  '%Y-%m-%dT%H:%M:%SZ',
                  '%Y-%m-%d %H:%M:%S',
                  '%Y-%m-%d',
              ]

              for fmt in formats:
                  try:
                      dt = datetime.strptime(value, fmt)

                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)

                      return dt.astimezone(timezone.utc)

                  except Exception:
                      continue

              return None


          def news_fingerprint(article, symbol):
              raw = (
                  f"{symbol}|{article.get('title', '')}|"
                  f"{article.get('link', '')}"
              )

              return hashlib.sha256(raw.encode('utf-8')).hexdigest()


          def keyword_in_text(keyword, text):
              kw = keyword.lower()

              # Короткие слова ищем как отдельные слова, чтобы
              # 'sec' не срабатывало на 'second', а 'иск' на 'риск'
              if kw.isascii() and len(kw) <= 3:
                  return re.search(r'\b' + re.escape(kw) + r'\b', text) is not None

              if not kw.isascii() and len(kw) <= 4:
                  return re.search(r'\b' + re.escape(kw), text) is not None

              return kw in text


          def detect_news_signal(text):
              lowered = (text or '').lower()

              for signal, keywords in NEWS_SIGNALS:
                  for keyword in keywords:
                      if keyword_in_text(keyword, lowered):
                          return signal

              return None


          def article_matches_symbol(article, symbol):
              text = (
                  article.get('title', '') + ' ' +
                  article.get('description', '')
              ).lower()

              coin_key = symbol.replace('USDT', '')

              for keyword in NEWS_KEYWORDS.get(coin_key, []):
                  pattern = r'\b' + re.escape(keyword.lower()) + r'\b'

                  if re.search(pattern, text):
                      return True

              return False


          def parse_rss(content, source):
              articles = []

              try:
                  root = ET.fromstring(content)

              except Exception as e:
                  print(f'RSS parse error {source}: {e}')
                  return articles

              for item in root.iter():
                  if not item.tag.lower().endswith('item'):
                      continue

                  title = ''
                  description = ''
                  link = ''
                  pub_date = None

                  for child in item:
                      tag = child.tag.lower()

                      if tag.endswith('title'):
                          title = clean_text(child.text or '')

                      elif tag.endswith('description'):
                          description = clean_text(child.text or '')

                      elif tag.endswith('link'):
                          link = (child.text or '').strip()

                      elif (
                          tag.endswith('pubdate')
                          or tag.endswith('published')
                          or tag.endswith('updated')
                      ):
                          pub_date = parse_news_date(child.text or '')

                  if title:
                      articles.append(
                          {
                              'source': source,
                              'title': title,
                              'description': description,
                              'link': link,
                              'published': pub_date,
                          }
                      )

              return articles


          def collect_rss_news():
              all_articles = []

              for source, url in NEWS_FEEDS:
                  try:
                      content = http_get_text(url, timeout=NEWS_TIMEOUT)
                      all_articles.extend(parse_rss(content, source))

                  except Exception as e:
                      print(f'News feed error {source}: {e}')

              return all_articles


          def collect_crypto_ru_news():
              articles = []

              try:
                  content = http_get_text(
                      CRYPTO_RU_NEWS_URL, timeout=NEWS_TIMEOUT
                  )

                  text = content.decode('utf-8', errors='ignore')

                  pattern = re.compile(
                      r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                      re.IGNORECASE | re.DOTALL
                  )

                  for match in pattern.finditer(text):
                      link = match.group(1)
                      title = clean_text(match.group(2))

                      if not title:
                          continue

                      if link.startswith('/'):
                          link = 'https://crypto.ru' + link

                      if 'crypto.ru' not in link:
                          continue

                      articles.append(
                          {
                              'source': 'Crypto.ru',
                              'title': title,
                              'description': '',
                              'link': link,
                              'published': None,
                          }
                      )

              except Exception as e:
                  print(f'Crypto.ru error: {e}')

              return articles


          def collect_news():
              now = datetime.now(timezone.utc)
              cutoff = now - timedelta(hours=NEWS_LOOKBACK_HOURS)

              articles = collect_rss_news()
              articles.extend(collect_crypto_ru_news())

              context = {}
              seen = set()

              for article in articles:
                  title = article.get('title', '')
                  link = article.get('link', '')

                  unique = (title.lower(), link.lower())

                  if unique in seen:
                      continue

                  seen.add(unique)

                  published = article.get('published')

                  if published and published < cutoff:
                      continue

                  text = title + ' ' + article.get('description', '')

                  signal = detect_news_signal(text)

                  if not signal:
                      continue

                  article['signal'] = signal

                  for symbol in SYMBOLS:
                      if article_matches_symbol(article, symbol):
                          context.setdefault(symbol, []).append(article)

              for symbol in context:
                  context[symbol].sort(
                      key=lambda a: (
                          a.get('published')
                          or datetime.min.replace(tzinfo=timezone.utc)
                      ),
                      reverse=True
                  )

              return context


          def format_news_line(article):
              signal = article.get('signal', '📰 NEWS')
              title = article.get('title', 'Без заголовка')
              source = article.get('source', '')
              link = article.get('link', '')

              message = f'{signal}\n📰 {title}\nИсточник: {source}'

              if link:
                  message += '\n' + link

              return message


          # ============================================================
          # PRICE MESSAGE (per-coin)
          # ============================================================

          def fmt_change(value):
              if value is None:
                  return 'н/д'

              return f'{value:+.2f}%'


          def send_price_alert(
              state,
              symbol,
              market,
              level,
              change,
              period,
              price_alerts,
              news_article=None,
              signal_type='PRICE'
          ):
              price = market['price']

              direction = '📈' if change > 0 else '📉'

              signal_strength = calculate_signal_strength(
                  price_alerts, news_article
              )

              fingerprint = (
                  f'{symbol}:{signal_type}:{level}:{period}:{direction}'
              )

              cooldown = COOLDOWN_BY_LABEL.get(period)

              if alert_already_sent(
                  state, fingerprint, cooldown_minutes=cooldown
              ):
                  return False

              changes_text = '\n'.join(
                  f"{PERIOD_LABELS[m]}: {fmt_change(market.get(f'change_{m}'))}"
                  for m in ALL_PERIODS
              )

              message = (
                  f'{direction} {symbol}\n\n'
                  f'💰 Цена: {price:.10g}\n\n'
                  f'{changes_text}\n\n'
                  f'🟠 {level} MOVE\n'
                  f'🔥 Сила сигнала: {signal_strength}\n'
                  f'⏱ Период: {period}'
              )

              if news_article:
                  message += (
                      '\n\n📰 Фундаментальный фактор:\n'
                      + format_news_line(news_article)
                  )

              message += '\n\nBitget Spot'

              print('\nPRICE ALERT:\n' + message)

              try:
                  if send_telegram(message):
                      mark_alert_sent(state, fingerprint)

                      if news_article:
                          mark_news_sent(
                              state, news_fingerprint(news_article, symbol)
                          )

                      return True

              except Exception as e:
                  print(f'Telegram price error: {e}')

              return False


          # ============================================================
          # STANDALONE FUNDAMENTAL NEWS
          # ============================================================

          def send_standalone_news(state, news_context, combined_news):
              news_sent = 0

              for symbol in SYMBOLS:
                  if news_sent >= MAX_NEWS_ALERTS_PER_RUN:
                      break

                  for article in news_context.get(symbol, []):
                      if news_sent >= MAX_NEWS_ALERTS_PER_RUN:
                          break

                      fp = news_fingerprint(article, symbol)

                      if fp in combined_news:
                          continue

                      if news_already_sent(state, fp):
                          continue

                      message = (
                          '📰 FUNDAMENTAL EVENT\n\n'
                          f'🪙 {symbol}\n\n'
                          f'{format_news_line(article)}\n\n'
                          'Цена пока не показывает достаточного движения.\n\n'
                          'Bitget Spot'
                      )

                      print('\nNEWS ALERT:\n' + message)

                      try:
                          if send_telegram(message):
                              mark_news_sent(state, fp)
                              news_sent += 1

                      except Exception as e:
                          print(f'Telegram news error: {e}')

              return news_sent


          # ============================================================
          # TEST TELEGRAM
          # ============================================================

          if TEST_TELEGRAM:
              test_message = (
                  '🚀 Uncle Goo Crypto Monitor\n\n'
                  'Тестовое сообщение работает!\n\n'
                  'Мониторинг:\n'
                  '• Bitget Spot\n'
                  '• 5m / 15m / 30m / 45m / 60m / 4h / 24h\n'
                  '• РБК\n'
                  '• Investing.com\n'
                  '• ForkLog\n'
                  '• Crypto.ru\n'
                  '• Рыночная сводка (breadth)\n\n'
                  'Сигналы:\n'
                  '📈 Price + News + Market breadth'
              )

              print('Sending Telegram test...')

              try:
                  if send_telegram(test_message):
                      print('Telegram test sent successfully.')
                  else:
                      print('Telegram test failed.')

              except Exception as e:
                  print(f'Telegram test error: {e}')


          # ============================================================
          # MAIN
          # ============================================================

          state = load_state()

          alerts_sent = 0
          combined_news = set()

          print('')
          print('=' * 75)
          print('UNCLE GOO CRYPTO MONITOR')
          print('=' * 75)
          print('Bitget Spot')
          print('5m / 15m / 30m / 45m / 60m / 4h / 24h')
          print('Price + News + Market breadth (parallel fetch)')
          print('=' * 75)

          news_context = {}
          markets = {}

          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
              news_future = pool.submit(collect_news)

              market_futures = {
                  pool.submit(calculate_market, symbol): symbol
                  for symbol in SYMBOLS
              }

              for future in as_completed(market_futures):
                  symbol = market_futures[future]

                  try:
                      markets[symbol] = future.result()

                  except Exception as e:
                      print(f'ERROR {symbol}: {e}')
                      markets[symbol] = None

              try:
                  news_context = news_future.result()

              except Exception as e:
                  print(f'NEWS COLLECT ERROR: {e}')
                  news_context = {}


          # ============================================================
          # PROCESS RESULTS (fixed symbol order for stable logs)
          # ============================================================

          for symbol in SYMBOLS:
              market = markets.get(symbol)

              if market is None:
                  continue

              try:
                  price = market['price']
                  market_time = market['market_time']

                  changes_log = ' '.join(
                      f"{PERIOD_LABELS[m]}={fmt_change(market.get(f'change_{m}'))}"
                      for m in ALL_PERIODS
                  )

                  print(
                      f'{symbol}: price={price:.10g} {changes_log} '
                      f"UTC={market_time.strftime('%Y-%m-%d %H:%M:%S')}"
                  )

                  price_alerts = get_price_alerts(market)

                  if not price_alerts:
                      continue

                  relevant_news = news_context.get(symbol, [])
                  fresh_news = relevant_news[0] if relevant_news else None

                  # От самого сильного к слабому: если сильный сигнал
                  # на кулдауне (например 24h), может сработать более
                  # быстрый (например 5m). Отправляем один алерт на монету.
                  ordered = sorted(
                      price_alerts,
                      key=lambda x: (SEVERITY.get(x[0], 0), abs(x[1])),
                      reverse=True
                  )

                  for level, change, period in ordered:
                      sent = send_price_alert(
                          state,
                          symbol,
                          market,
                          level,
                          change,
                          period,
                          price_alerts,
                          news_article=fresh_news,
                          signal_type='PRICE_NEWS' if fresh_news else 'PRICE'
                      )

                      if sent:
                          alerts_sent += 1

                          if fresh_news:
                              combined_news.add(
                                  news_fingerprint(fresh_news, symbol)
                              )

                          break

              except Exception as e:
                  print(f'ERROR {symbol}: {e}')


          # ============================================================
          # MARKET-WIDE BREADTH CHECK
          # ============================================================

          market_alerts_sent = 0

          try:
              market_breadth_alerts = get_market_breadth_alerts(markets)

              if market_breadth_alerts:
                  market_alerts_sent = send_market_breadth_alerts(
                      state, market_breadth_alerts
                  )

          except Exception as e:
              print(f'MARKET BREADTH ERROR: {e}')


          # ============================================================
          # STANDALONE FUNDAMENTAL NEWS
          # ============================================================

          try:
              news_sent = send_standalone_news(
                  state, news_context, combined_news
              )

          except Exception as e:
              print(f'NEWS PROCESS ERROR: {e}')
              news_sent = 0


          # ============================================================
          # SAVE
          # ============================================================

          save_state(state)

          try:
              save_state_to_github()

          except Exception as e:
              print(f'GitHub state save error: {e}')


          # ============================================================
          # SUMMARY
          # ============================================================

          print('')
          print('=' * 75)
          print(f'Price/combined alerts sent: {alerts_sent}')
          print(f'Market breadth alerts sent: {market_alerts_sent}')
          print(f'Standalone news alerts sent: {news_sent}')

          if alerts_sent == 0 and market_alerts_sent == 0 and news_sent == 0:
              print('No alerts.')

          print('=' * 75)

