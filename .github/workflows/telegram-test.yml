          # ============================================================
          # HTTP
          # ============================================================

          def http_get_json(url, params=None, timeout=20):
              if params:
                  url += '?' + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent':
                          'Uncle-Goo-Crypto-Monitor/1.0'
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:
                  return json.loads(
                      response.read().decode('utf-8')
                  )


          def http_get_text(url, timeout=20):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent':
                          'Mozilla/5.0 Uncle-Goo-Crypto-Monitor/1.0',
                      'Accept':
                          'application/rss+xml, application/xml, '
                          'text/html, text/xml, */*',
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:
                  return response.read()


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_api(method, payload=None):
              if not TELEGRAM_BOT_TOKEN:
                  print(
                      'TELEGRAM_BOT_TOKEN is not configured.'
                  )
                  return {}

              url = (
                  f'https://api.telegram.org/'
                  f'bot{TELEGRAM_BOT_TOKEN}/{method}'
              )

              data = None

              if payload is not None:
                  data = urllib.parse.urlencode(
                      payload
                  ).encode('utf-8')

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      'User-Agent':
                          'Uncle-Goo-Crypto-Monitor/1.0'
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  return json.loads(
                      response.read().decode('utf-8')
                  )


          def get_chat_id_via_updates():
              result = telegram_api('getUpdates')
              updates = result.get('result', [])

              if not updates:
                  return None

              for update in reversed(updates):
                  message = update.get('message')

                  if (
                      message
                      and
                      message.get('chat')
                  ):
                      return message['chat']['id']

              return None


          def resolve_chat_id():
              if TELEGRAM_CHAT_ID:
                  return TELEGRAM_CHAT_ID

              chat_id = get_chat_id_via_updates()

              if chat_id is None:
                  print(
                      'Telegram chat ID not found.'
                  )
                  print(
                      'Set TELEGRAM_CHAT_ID secret, '
                      'or send /start to the bot first.'
                  )

              return chat_id


          def send_telegram(text):
              chat_id = resolve_chat_id()

              if chat_id is None:
                  return False

              result = telegram_api(
                  'sendMessage',
                  {
                      'chat_id': chat_id,
                      'text': text,
                      'disable_web_page_preview': False,
                  },
              )

              return result.get('ok', False)


          # ============================================================
          # STATE
          # ============================================================

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {
                      'sent_alerts': {},
                      'sent_news': {},
                  }

              try:
                  with open(
                      STATE_FILE,
                      'r',
                      encoding='utf-8'
                  ) as f:
                      state = json.load(f)

                  if not isinstance(state, dict):
                      state = {}

                  state.setdefault(
                      'sent_alerts',
                      {}
                  )

                  state.setdefault(
                      'sent_news',
                      {}
                  )

                  return state

              except Exception as e:
                  print(
                      f'State load error: {e}'
                  )

                  return {
                      'sent_alerts': {},
                      'sent_news': {},
                  }


          def save_state(state):
              try:
                  with open(
                      STATE_FILE,
                      'w',
                      encoding='utf-8'
                  ) as f:
                      json.dump(
                          state,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )

              except Exception as e:
                  print(
                      f'State save error: {e}'
                  )


          def cleanup_state(state):
              now = datetime.now(
                  timezone.utc
              )

              cutoff = now - timedelta(
                  hours=24
              )

              sent_alerts = state.get(
                  'sent_alerts',
                  {}
              )

              cleaned_alerts = {}

              for key, value in sent_alerts.items():
                  try:
                      dt = datetime.fromisoformat(
                          value
                      )

                      if dt >= cutoff:
                          cleaned_alerts[key] = value

                  except Exception:
                      pass

              state['sent_alerts'] = cleaned_alerts

              sent_news = state.get(
                  'sent_news',
                  {}
              )

              cleaned_news = {}

              for key, value in sent_news.items():
                  try:
                      dt = datetime.fromisoformat(
                          value
                      )

                      if dt >= cutoff:
                          cleaned_news[key] = value

                  except Exception:
                      pass

              state['sent_news'] = cleaned_news


          def alert_already_sent(
              state,
              fingerprint,
              cooldown_minutes=None
          ):
              cleanup_state(state)

              value = state.get(
                  'sent_alerts',
                  {}
              ).get(
                  fingerprint
              )

              if not value:
                  return False

              cooldown = (
                  cooldown_minutes
                  if cooldown_minutes is not None
                  else ALERT_COOLDOWN_MINUTES
              )

              try:
                  sent_at = datetime.fromisoformat(
                      value
                  )

                  age = (
                      datetime.now(
                          timezone.utc
                      ) - sent_at
                  )

                  return (
                      age.total_seconds()
                      <
                      cooldown * 60
                  )

              except Exception:
                  return False


          def mark_alert_sent(
              state,
              fingerprint
          ):
              state.setdefault(
                  'sent_alerts',
                  {}
              )[fingerprint] = (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )


          def news_already_sent(
              state,
              fingerprint
          ):
              cleanup_state(state)

              return (
                  fingerprint
                  in
                  state.get(
                      'sent_news',
                      {}
                  )
              )


          def mark_news_sent(
              state,
              fingerprint
          ):
              state.setdefault(
                  'sent_news',
                  {}
              )[fingerprint] = (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )


          # ============================================================
          # GITHUB STATE SAVE
          # ============================================================

          def save_state_to_github():
              subprocess.run(
                  [
                      'git',
                      'config',
                      'user.name',
                      'github-actions[bot]'
                  ],
