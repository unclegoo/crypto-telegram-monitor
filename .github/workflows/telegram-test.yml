          # MARKET-WIDE BREADTH SETTINGS (variant 4: breadth + avg move)
          # ============================================================

          # Minimum fraction of coins moving in the same direction
          # (based on successfully fetched coins for that period) for
          # the move to be considered "market-wide" rather than
          # isolated to a few coins.
          MARKET_BREADTH_MIN = 0.55

          # Minimum per-coin move (absolute %) to count a coin as
          # "moving" in a direction for breadth purposes. Filters out
          # coins that are basically flat.
          MARKET_MOVING_THRESHOLD = 0.3

          # (sharp, strong, very_strong, extreme) thresholds for the
          # AVERAGE % change across all coins, per period. Lower than
          # the per-coin thresholds above, since averaging many coins
          # dampens the number.
          MARKET_AVG_THRESHOLDS = {
              5:  (1.0, 1.8, 3.0, 4.5),
              15: (1.5, 2.5, 4.0, 6.0),
              30: (2.0, 3.5, 5.5, 8.0),
              45: (2.5, 4.0, 6.5, 9.5),
